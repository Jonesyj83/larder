{% from '_date_field.html' import date_field %}
{% extends "base.html" %}
{% block content %}
<div x-data="planPage()">
  <div class="row page-head">
    <h1 class="grow">Meal plan</h1>
  </div>

  <div class="row toolbar">
    <button aria-label="Previous week" @click="move(-7)">&larr;</button>
    <b x-text="weekLabel()"></b>
    <button aria-label="Next week" @click="move(7)">&rarr;</button>
    <button class="small" @click="start = monday(today()); load()">This week</button>
    <span class="grow"></span>
    <button @click="showNeeds()">What we need</button>
  </div>

  <div class="week">
    <template x-for="d in dayList()" :key="d">
      <div class="day" :class="d == today() && 'today'">
        <div class="row">
          <b class="grow small" x-text="dayName(d)"></b>
          <button class="small" @click="openAdd(d)">+</button>
        </div>
        <template x-for="s in slots" :key="s">
          <div class="slot" x-show="mealsFor(d, s).length">
            <b x-text="s"></b>
            <template x-for="m in mealsFor(d, s)" :key="m.id">
              <div class="meal">
                <span class="meal-name" :title="m.recipe || m.note">
                  <a x-show="m.recipe_id" :href="BASE + '/recipes?id=' + m.recipe_id + '&servings=' + ((m.cook_event_id ? m.cook_servings : m.servings) || '')" x-text="m.recipe"></a>
                  <span x-show="!m.recipe_id" x-text="m.note"></span>
                </span>
                <span class="muted meal-servings" x-show="m.servings" x-text="'×' + num(m.servings)"></span>
                <details class="meal-actions" @click.outside="$el.open = false" @keydown.escape.stop="$el.open = false; $el.querySelector('summary').focus()">
                  <summary :aria-label="'Actions for ' + (m.recipe || m.note)" title="Meal actions">⋯</summary>
                  <div class="meal-menu">
                    <span class="small" x-text="m.recipe || m.note"></span>
                    <span class="muted small" x-show="m.recipe_id && m.note && m.note != m.recipe" x-text="m.note"></span>
                    <span class="muted small" x-show="m.cook_event_id" x-text="'Batch: ' + num(m.cook_servings) + ', allocated this week: ' + num(meals.filter(x => x.cook_event_id === m.cook_event_id).reduce((n, x) => n + x.servings, 0))"></span>
                    <button @click="$el.closest('details').open = false; openEdit(m)">Edit</button>
                    <a x-show="m.recipe_id" :href="BASE + '/recipes?id=' + m.recipe_id">View recipe ingredients</a>
                    <button class="danger" @click="$el.closest('details').open = false; remove(m)" :aria-label="'Remove ' + (m.recipe || m.note)">Remove</button>
                  </div>
                </details>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>

  <p class="space-top muted small">
    Servings get worked out from who's eating and their portion size (set in Settings).
    Your portion size: <b>{{ user.portion_size }}</b>.
  </p>

  <!-- add meal -->
  <template x-if="adding">
    <div class="modal-bg" @click.self="adding = null">
      <form class="modal" @submit.prevent="add()">
        <b x-text="adding.id ? 'Edit meal' : 'Add meal'"></b>
        <label>Day</label>{{ date_field('adding.day', 'Meal day', true) }}
        <label>Meal</label>
        <div class="row">
          <template x-for="s in slots" :key="s">
            <label class="inline small"><input type="radio" :value="s" x-model="adding.slot"> <span x-text="s"></span></label>
          </template>
        </div>
        <label class="field">Recipe<select x-model="adding.recipe_id" @change="calcServings()">
          <option value="">Simple meal or note</option>
          <template x-for="r in recipes" :key="r.id">
            <option :value="r.id" x-text="r.name + (r.can_make ? '' : ' (' + r.missing_count + ' missing)')"></option>
          </template>
        </select></label>
        <label x-text="adding.recipe_id ? 'Note (optional)' : 'What is it?'"></label>
        <input :aria-label="adding.recipe_id ? 'Note (optional)' : 'What is it?'" x-model="adding.note" :required="!adding.recipe_id" placeholder="e.g. leftovers, takeaway">
        <div class="space-top row">
          <button class="primary" :disabled="busy" x-text="adding.id ? 'Save meal' : 'Add meal'"></button>
          <button type="button" @click="adding = null">Cancel</button>
        </div>
      </form>
    </div>
  </template>

  <!-- needs -->
  <template x-if="needs">
    <div class="modal-bg" @click.self="needs = null">
      <div class="modal">
        <b>Ingredients for this week</b>
        <p class="muted small" x-show="!needs.items.length && !needs.unmapped.length && !needs.problems.length">No ingredient needs recorded this week.</p>
        <template x-for="m in needs.unmapped" :key="m.id">
          <div class="notice card small"><span x-text="formatDate(m.day) + ' ' + m.slot + ': ' + m.note + ' — no ingredients linked; needs cannot be calculated.'"></span>
            <button class="small" @click="findUnmapped(m)">Choose recipe</button>
          </div>
        </template>
        <table class="small" x-show="needs.items.length">
          <tr><th>Product</th><th>Need</th><th>Have</th><th>Short</th></tr>
          <template x-for="i in needs.items" :key="i.id">
            <tr>
              <td x-text="i.name"></td>
              <td x-text="qty(i.need, i.unit)"></td>
              <td x-text="qty(i.have, i.unit)"></td>
              <td :class="i.missing > 0 ? 'bad' : 'ok'" x-text="i.missing > 0 ? qty(i.missing, i.unit) : 'ok'"></td>
            </tr>
          </template>
        </table>
        <template x-for="p in needs.problems"><p class="bad small" x-text="p"></p></template>
        <div class="space-top row">
          <button class="primary" x-show="needs.items.some(i => i.missing > 0)" @click="needsToShopping()">Put what's short on the shopping list</button>
          <button @click="needs = null">Close</button>
        </div>
      </div>
    </div>
  </template>

</div>
<script>
function monday(iso) {
  const d = new Date(iso + 'T12:00:00');
  const back = (d.getDay() + 6) % 7;
  return addDays(iso, -back);
}

function planPage() {
  return {
    start: monday(today()), meals: [], slots: ['breakfast', 'lunch', 'dinner', 'snack', 'dessert'],
    busy: false, recipes: [], household: [], products: [], units: [], batches: [], useBatchId: '', adding: null, needs: null,
    meId: {{ user.id }},

    async init() {
      [this.recipes, this.household, this.products, this.units, this.batches] = await Promise.all([api('/api/recipes/makeable'), api('/api/household'), api('/api/products'), api('/api/units'), api('/api/cooked-batches')]);
      this.load();
    },
    async load() {
      try {
        const r = await api('/api/mealplan?start=' + this.start + '&days=7');
        this.meals = r.meals;
      } catch (e) { oops(e); }
    },
    move(n) { this.start = addDays(this.start, n); this.load(); },
    dayList() { return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(this.start, i)); },
    dayName(iso) {
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-AU', { weekday: 'short' }) + ' ' + formatDate(iso);
    },
    weekLabel() { return this.dayName(this.start) + ' - ' + this.dayName(addDays(this.start, 6)); },
    mealsFor(d, s) { return this.meals.filter(m => m.day == d && m.slot == s); },

    openAdd(day) {
      this.adding = { request_id: saveRequestId(), day, slot: 'dinner', recipe_id: '', note: '', eaters: [this.meId], servings: null, ingredients: [] };
      this.useBatchId = '';
      this.calcServings();
    },
    async openEdit(m) {
      const draft = {request_id: saveRequestId(), ...m, recipe_id: m.simple_meal ? '' : (m.recipe_id || ''), eaters: [], ingredients: []};
      if (m.simple_meal && m.recipe_id) {
        try { const r = await api('/api/recipes/' + m.recipe_id);
          const scale = r.servings > 0 && m.servings > 0 ? m.servings / r.servings : 1;
          draft.ingredients = r.ingredients.map(i => ({product_id: i.product_id, amount: i.amount * scale, unit_id: i.unit_id || i.stock_unit_id, note: i.note}));
        } catch (e) { return oops(e); }
      }
      this.adding = draft;
    },
    async findForMeal(m) { await this.openEdit(m); },
    async findUnmapped(m) {
      this.needs = null;
      const meal = this.meals.find(x => x.id == m.id);
      if (meal) await this.openEdit(meal);
    },
    pickIngredient(i) {
      const p = this.products.find(p => p.id == i.product_id);
      if (p) i.unit_id = p.unit_id;
    },
    calcServings() {
      const ids = this.adding.eaters.map(Number);
      const total = this.household.filter(u => ids.includes(u.id)).reduce((a, u) => a + u.factor, 0);
      this.adding.servings = total || null;
    },
    async add() {
      if (this.busy) return;
      this.busy = true;
      const a = this.adding;
      try {
        const body = {request_id: a.request_id, day: a.day, slot: a.slot, recipe_id: a.recipe_id ? Number(a.recipe_id) : null,
          note: a.note, servings: a.servings === '' || a.servings == null ? null : Number(a.servings), eaters: a.eaters.map(Number)};
        if (!a.recipe_id && (a.ingredients.length || a.simple_meal)) body.ingredients = a.ingredients.map(ingredientBody);
        await api('/api/mealplan' + (a.id ? '/' + a.id : ''), {method: a.id ? 'PUT' : 'POST', body});
        this.adding = null;
        [this.recipes, this.products] = await Promise.all([api('/api/recipes/makeable'), api('/api/products')]);
        this.load();
      } catch (e) { oops(e); }
      this.busy = false;
    },
    async remove(m) {
      try { await api('/api/mealplan/' + m.id, { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
    async useStoredMeal() {
      if (!this.useBatchId || this.busy) return;
      this.busy = true;
      try {
        await api('/api/mealplan/from-batch', { method: 'POST', body:
          { day: this.adding.day, slot: this.adding.slot, batch_id: this.useBatchId } });
        this.adding = null;
        this.batches = await api('/api/cooked-batches');
        this.load();
      } catch (e) { oops(e); }
      this.busy = false;
    },
    async showNeeds() {
      try { this.needs = await api('/api/mealplan/needs?start=' + this.start + '&end=' + addDays(this.start, 6)); } catch (e) { oops(e); }
    },
    async needsToShopping() {
      try {
        const r = await api('/api/mealplan/shopping?start=' + this.start + '&end=' + addDays(this.start, 6), { method: 'POST' });
        toast('Added ' + r.added + ' to the shopping list');
        this.needs = null;
      } catch (e) { oops(e); }
    },
  };
}
</script>
{% endblock %}
