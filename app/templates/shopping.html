{% extends "base.html" %}
{% block content %}
<div class="shopping-page" x-data="shoppingPage()">
  <div class="page-head">
    <h1>Order list</h1>
    <button class="btn-ghost" @click="addMissing()">Add what's running low</button>
  </div>

  <p class="muted small" x-show="quantityHint" x-cloak>
    <span x-text="quantityHint ? 'You usually get ' + quantityHint.typical_amount + ' ' + (quantityHint.typical_unit || '') + ' of ' + quantityHint.label : ''"></span>
    <button type="button" class="small" @click="acceptQuantityHint()">Use usual quantity</button>
  </p>
  <section class="summary-strip" aria-label="List summary" x-show="items.length">
    <div class="summary-metric">
      <span class="label">Estimated total</span>
      <span class="value" x-text="money(estimatedTotal)"></span>
      <span class="delta" x-show="pricedItems.length" x-text="matchedCount + ' / ' + pricedItems.length + ' priced'"></span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-metric cheapest-store" x-show="bestSingleStore">
      <span class="label">Cheapest if bought at one store</span>
      <span class="store-tag" x-text="bestSingleStore ? (storeName(bestSingleStore.store) + ' — ' + money(bestSingleStore.total)) : ''"></span>
      <span class="delta" x-show="splitSavings > 0.004" x-text="'Splitting across stores saves ' + money(splitSavings) + ' more'"></span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-metric">
      <span class="label">Items</span>
      <span class="value"><span x-text="items.length"></span> <small x-text="'· ' + doneCount + ' ticked off'"></small></span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-metric">
      <span class="label">Matched to a store price</span>
      <span class="value"><span x-text="matchedCount"></span> <small x-text="'/ ' + pricedItems.length"></small></span>
      <span class="delta bad" x-show="pricedItems.length - matchedCount > 0" x-text="(pricedItems.length - matchedCount) + ' need matching'"></span>
    </div>
  </section>

  <form class="add-bar" @submit.prevent="add()">
    <input class="grow" aria-label="Generic item to order" placeholder="Add a generic item (e.g. water 24 bottles)" x-model="text" autocomplete="off" maxlength="200">
    <span class="divider"></span>
    <input class="qty-mini" type="number" step="any" min="0.000001" aria-label="Quantity" x-model.number="amount" required>
    <button class="primary" type="submit">Add</button>
  </form>

  <section class="list-surface">
    <div class="state-block" x-show="!items.length">
      <div class="state-icon">🧺</div>
      <h3>This list is empty</h3>
      <p>Add something above, or use "Add what's running low" to fill it from items you're short on.</p>
    </div>
    <template x-for="i in items" :key="i.id">
      <div class="shop-row" :class="i.done ? 'is-done' : ''">
        <div class="shop-identity">
          <input type="checkbox" class="check-item" :aria-label="'Tick off ' + i.label" :checked="i.done" @change="toggle(i)">
          <template x-if="i.picture">
            <div class="thumb"><img :src="pic(i.picture)" alt=""></div>
          </template>
        </div>
        <div class="shop-product">
          <span class="shop-name" x-text="i.label"></span>
          <span class="shop-meta" x-show="i.stock_covers_need">Already have enough in stock</span>
          <span class="pill" x-show="!i.product_id">not a product</span>
          <span class="shop-meta" x-show="i.note" x-text="i.note"></span>
        </div>
        <div class="store-chips" :title="i.pricingError">
          <template x-for="store in enabledStores" :key="store.store">
            <div class="store-chip-cell">
              <button type="button" class="store-chip" :data-store="store.store"
                      :class="[storeLink(i, store.store) && cheapest(i, storeLink(i, store.store)) ? 'cheapest' : '', !storeLink(i, store.store) ? 'unmatched' : '']"
                      @click.stop="openPicker(i, store.store)">
                <span class="store-chip-heading">
                  <span class="store-label" x-text="storeName(store.store)"></span>
                  <span class="substitute-mark" x-show="storeLink(i, store.store)?.is_substitute" title="Closest substitute" aria-label="Closest substitute">≈</span>
                  <span class="small" style="color:var(--warn)" x-show="storeLink(i, store.store)?.needs_review">Review</span>
                </span>
                <span class="store-price" x-text="badgePrice(i, store.store)"></span>
              </button>
              <template x-if="i.picker && i.picker.store === store.store">
                <div class="store-picker" @click.outside="i.picker = null" @keydown.escape.window="i.picker = null">
                  <template x-if="i.picker.mode === 'info' && storeLink(i, store.store)">
                    <div class="match-info">
                      <b x-text="productTitle(storeLink(i, store.store).store_name)"></b>
                      <p class="muted small" x-show="storeLink(i, store.store).size" x-text="offerSize(storeLink(i, store.store))"></p>
                      <p>
                        <strong x-text="offerPrice(storeLink(i, store.store))"></strong>
                        <del class="muted small" x-show="storeLink(i, store.store).latest_check?.on_special && storeLink(i, store.store).latest_check?.was_price != null" x-text="offerPrice(storeLink(i, store.store), true)"></del>
                      </p>
                      <p class="muted small" x-text="checkedText(storeLink(i, store.store).latest_check?.checked_at)"></p>
                      <p class="muted small" x-show="storeLink(i, store.store).is_substitute">Closest substitute, rather than the same product.</p>
                      <p class="muted small" x-show="storeLink(i, store.store).needs_review">A few products matched. Choose once for this store.</p>
                      <button type="button" class="small" x-show="storeLink(i, store.store).needs_review" :disabled="i.picker.busy" @click="confirmMatch(i, store.store)">Keep this match</button>
                      <button type="button" class="small" @click="i.picker.mode = 'search'; searchMatches(i)">Change match</button>
                      <button type="button" class="small" @click="i.picker = null">Close</button>
                    </div>
                  </template>
                  <div x-show="i.picker.mode === 'search'">
                  <form @submit.prevent="searchMatches(i)">
                    <input x-model="i.picker.query" :aria-label="'Search ' + storeName(store.store)" maxlength="200" required>
                    <button class="small" :disabled="i.picker && i.picker.busy">Search</button>
                    <button type="button" class="small" x-show="storeLink(i, store.store)" @click="unlink(i, store.store)">Unlink</button>
                    <button type="button" class="small" @click="i.picker = null">Close</button>
                  </form>
                  <p class="muted small" x-show="i.picker && i.picker.message" x-text="i.picker && i.picker.message"></p>
                  <template x-for="candidate in (i.picker ? i.picker.candidates : [])" :key="candidate.store_item_id">
                    <button type="button" class="small picker-result" :disabled="i.picker && i.picker.busy" @click="pickMatch(i, store.store, candidate)"
                            x-text="[productTitle(candidate.name), candidate.brand, offerSize(candidate), offerPrice(candidate)].filter(Boolean).join(' · ')"></button>
                  </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <span class="shop-meta" x-show="!enabledStores.length">No stores enabled</span>
        </div>
        <div class="shop-trend">
          <button type="button" class="history-trigger" x-show="i.historyChart" :aria-label="'Expand price history for ' + i.label" @click="openHistory(i, $el)">
          <svg class="price-history-chart" viewBox="0 0 560 210" role="img" :aria-label="'Price history for ' + i.label" x-effect="drawHistory($el, i.historyChart)"></svg>
          </button>
          <span class="trend-label muted" x-show="!i.historyChart" x-text="i.pricingError || 'No price history yet'"></span>
        </div>
        <div class="qty-col">
          <div class="qty-stepper">
            <button type="button" aria-label="Decrease quantity" @click="step(i, -1)">–</button>
            <input type="number" min="0.000001" step="any" :aria-label="'Quantity for ' + i.label" x-model.number="i.amount" @change="updateAmount(i)">
            <button type="button" aria-label="Increase quantity" @click="step(i, 1)">+</button>
          </div>
        </div>
        <div class="shop-actions">
          <div class="move-control">
            <button class="small" @click="openMove(i)">Add to list</button>
            <div class="store-picker move-picker" x-show="i.moveOpen" @click.outside="i.moveOpen = false" x-cloak @keydown.escape.window="i.moveOpen = false">
              <div x-show="!i.moveStore">
                <span class="muted small" x-show="!priceLinks(i).length">Match a store product before adding to a shopping list.</span>
                <template x-for="link in priceLinks(i)" :key="link.store">
                  <button type="button" class="small picker-result" @click="i.moveStore = link.store" x-text="[storeName(link.store), productTitle(link.store_name), offerSize(link), offerPrice(link)].filter(Boolean).join(' · ')"></button>
                </template>
              </div>
              <div x-show="i.moveStore">
              <template x-for="list in lists.filter(l => l.kind === 'plain')" :key="list.id">
                <button class="small picker-result" @click="moveItem(i, {list_id: list.id})" x-text="list.name"></button>
              </template>
              <form @submit.prevent="moveItem(i, {name: i.newListName})">
                <input aria-label="New shopping list name" placeholder="New list name" x-model="i.newListName" maxlength="200" required>
                <button class="small">Create &amp; move</button>
              </form>
              </div>
            </div>
          </div>
          <button class="icon-btn" x-show="!i.product_id" @click="makeProduct(i)" title="Create product &amp; add to stock">＋</button>
          <button class="icon-btn danger-btn" :aria-label="'Remove ' + i.label" @click="remove(i)" title="Remove from list">✕</button>
        </div>
      </div>
    </template>
    <div class="space-top-small row" x-show="items.some(i => i.done)">
      <button class="small" @click="clearDone()">Clear ticked items</button>
    </div>
  </section>
  <template x-if="historyItem">
    <div class="modal-bg" @click.self="closeHistory()" @keydown.escape.window="closeHistory()">
      <div class="modal history-modal" role="dialog" aria-modal="true" aria-labelledby="history-title" @keydown.tab.prevent="$refs.historyClose.focus()">
        <div class="row"><b id="history-title" class="grow" x-text="'Price history — ' + historyItem.label"></b><button type="button" x-ref="historyClose" @click="closeHistory()">Close</button></div>
        <svg class="price-history-chart" viewBox="0 0 960 420" role="img" :aria-label="'Price history for ' + historyItem.label" x-effect="drawHistory($el, historyItem.historyChart)"></svg>
        <div class="row"><template x-for="series in historyItem.historyChart.stores" :key="series.store"><span :style="{color: series.colour}" x-text="series.name"></span></template><span class="muted" x-show="historyItem.historyChart.purchases.length">● Your purchases</span></div>
      </div>
    </div>
  </template>
</div>
<script>
function shoppingPage() {
  return storePricing({
    drawHistory, quantityHint: null,
    suggestions: [], suggestionsOpen: false, suggestionVersion: 0,
    liveSuggestions: [], suggestionStore: '', suggestionMessage: '', suggestionCache: {},
    liveSearchCount: 0, lastLiveSearch: 0, liveSearchBusy: false, suggestionTimer: null, adding: false,
    dismissSuggestions() {
      ++this.suggestionVersion; clearTimeout(this.suggestionTimer); this.suggestionsOpen = false;
    },
    resetSuggestions() {
      ++this.suggestionVersion;
      clearTimeout(this.suggestionTimer);
      this.suggestions = []; this.liveSuggestions = []; this.suggestionMessage = ''; this.suggestionsOpen = false;
    },
    async suggestProducts() {
      const query = this.text.trim(), version = ++this.suggestionVersion;
      clearTimeout(this.suggestionTimer);
      if (!query) { this.resetSuggestions(); return; }
      try {
        const products = await api('/api/products?q=' + encodeURIComponent(query));
        if (version !== this.suggestionVersion || query !== this.text.trim()) return;
        this.suggestions = products.sort((a, b) => Number(b.name.toLowerCase().startsWith(query.toLowerCase())) - Number(a.name.toLowerCase().startsWith(query.toLowerCase())));
        this.suggestionsOpen = !!products.length;
        if (products.length < 3 && query.length >= 2) {
          this.suggestionTimer = setTimeout(() => this.suggestStore(query, version), Math.max(300, 3000 - (Date.now() - this.lastLiveSearch)));
        }
      } catch (e) { if (version === this.suggestionVersion) this.suggestionsOpen = false; }
    },
    async suggestStore(query, version) {
      if (version !== this.suggestionVersion || query !== this.text.trim()) return;
      const stores = this.enabledStores;
      if (!stores.length) return;
      if (this.liveSearchBusy) {
        this.suggestionTimer = setTimeout(() => this.suggestStore(query, version), 500); return;
      }
      if (this.liveSearchCount >= 5) {
        this.suggestionMessage = 'Search limit reached. Add the item and use its store search to match it.';
        this.suggestionsOpen = true; return;
      }
      this.liveSearchCount++; this.lastLiveSearch = Date.now(); this.liveSearchBusy = true;
      this.suggestionMessage = 'Searching ' + stores.map(s => this.storeName(s.store)).join(', ') + '…'; this.suggestionsOpen = true;
      try {
        const results = await Promise.all(stores.map(async store => {
          const key = store.store + ':' + query.toLowerCase();
          if (!this.suggestionCache[key]) {
            try { this.suggestionCache[key] = (await api('/api/pricing/search?store=' + store.store + '&q=' + encodeURIComponent(query))).slice(0, 8); }
            catch (e) { this.suggestionCache[key] = []; }
          }
          return this.suggestionCache[key].map(c => ({...c, store: store.store}));
        }));
        if (version !== this.suggestionVersion || query !== this.text.trim()) return;
        this.liveSuggestions = results.flat();
        this.suggestionMessage = this.liveSuggestions.length ? '' : 'No store matches. You can still add this item.';
        this.suggestionsOpen = true;
      } finally { this.liveSearchBusy = false; }
    },
    lists: [], list_id: null, loadVersion: 0, stores: [], items: [], products: [], text: '', amount: 1,
    async init() {
      this.products = await api('/api/products');
      await this.load();
    },
    scoped(path = '') { return '/api/shopping' + path + '?list_id=' + this.list_id; },
    openMove(i) {
      if (i.moveOpen) { i.moveOpen = false; return; }
      i.moveStore = null;
      i.moveOpen = true;
    },
    async moveItem(i, body) {
      if (!i.moveStore) return;
      body = {...body, store: i.moveStore};
      try {
        await api(this.scoped('/' + i.id + '/move'), {method: 'POST', body});
        await this.load();
      } catch (e) { oops(e); }
    },
    async load() {
      try {
        const version = ++this.loadVersion;
        const lists = await api('/api/shopping/lists');
        if (version !== this.loadVersion) return;
        this.lists = lists;
        this.list_id = lists.find(l => l.kind === 'order').id;
        const items = await api(this.scoped());
        if (version !== this.loadVersion) return;
        this.items = items.map(i => ({...i, links: [], pricingLoaded: false, pricingError: '', historyChart: null, picker: null, moveOpen: false, newListName: ''}));
        this.loadPrices(this.items);
      } catch (e) { oops(e); }
    },
    // ---- Summary strip: derived entirely from items/prices already loaded above ----
    get pricedItems() { return this.items.filter(i => i.product_id); },
    get doneCount() { return this.items.filter(i => i.done).length; },
    get matchedCount() { return this.pricedItems.filter(i => this.priceLinks(i).length).length; },
    itemCost(i, link) {
      return this.offerCost(i, link);
    },
    get splitTotal() {
      let total = 0;
      for (const i of this.pricedItems) {
        const prices = this.priceLinks(i).map(l => this.itemCost(i, l)).filter(p => p != null);
        if (prices.length) total += Math.min(...prices);
      }
      return total;
    },
    get estimatedTotal() { return this.splitTotal; },
    get storeTotals() {
      const totals = {};
      for (const s of this.enabledStores) totals[s.store] = {store: s.store, total: 0, count: 0};
      for (const i of this.pricedItems) {
        for (const link of this.priceLinks(i)) {
          const cost = this.itemCost(i, link);
          if (cost == null || !totals[link.store]) continue;
          totals[link.store].total += cost;
          totals[link.store].count += 1;
        }
      }
      return Object.values(totals).filter(t => t.count > 0);
    },
    get bestSingleStore() {
      const totals = this.storeTotals;
      if (!totals.length) return null;
      const maxCount = Math.max(...totals.map(t => t.count));
      return totals.filter(t => t.count === maxCount).sort((a, b) => a.total - b.total)[0];
    },
    get splitSavings() {
      if (!this.bestSingleStore) return 0;
      return this.bestSingleStore.total - this.splitTotal;
    },
    step(i, delta) {
      const next = Math.max(1, (Number(i.amount) || 0) + delta);
      i.amount = next;
      this.updateAmount(i);
    },
    async updateAmount(i) {
      try {
        await api(this.scoped('/' + i.id), {method: 'PUT', body: {amount: i.amount}});
        await this.load();
      } catch (e) { oops(e); await this.load(); }
    },
    async add(selected = null, candidate = null) {
      const name = this.text.trim();
      if (!name || this.adding) return;
      const p = selected || this.products.find(x => x.name.toLowerCase() == name.toLowerCase());
      const body = { amount: this.amount || 1 };
      if (p) body.product_id = p.id; else body.name = name;
      if (candidate) {
        body.name = name;
        body.store_match = this.matchBody(candidate.store, candidate);
      }
      this.adding = true;
      try {
        const item = await api(this.scoped(), { method: 'POST', body });
        if (item.product_id && !this.products.some(p => p.id === item.product_id)) this.products.push({id: item.product_id, name: item.label});
        this.text = ''; this.amount = 1; this.resetSuggestions(); this.liveSearchCount = 0;
        this.quantityHint = item.typical_amount != null ? item : null;
        await this.load();
        // Prices for a brand-new item are matched in the background, not
        // held up in the add itself -- check back shortly once that's had
        // a moment to land, instead of making the add wait on it.
        if (item.product_id) setTimeout(() => this.load(), 4000);
      } catch (e) { oops(e); } finally { this.adding = false; }
    },
    async acceptQuantityHint() {
      const hint = this.quantityHint;
      if (!hint) return;
      try {
        await api(this.scoped('/' + hint.id), {method: 'PUT', body: {amount: hint.typical_amount, unit_id: hint.typical_unit_id}});
        this.quantityHint = null;
        await this.load();
      } catch (e) { oops(e); }
    },
    async toggle(i) {
      try {
        await api(this.scoped('/' + i.id), { method: 'PUT', body: { done: !i.done } });
        this.load();
      } catch (e) { oops(e); }
    },
    async makeProduct(i) {
      if (!confirm('Create ' + i.label + ' as a product and add ' + i.amount + ' to stock?')) return;
      try {
        await api(this.scoped('/' + i.id + '/make-product'), {method: 'POST', body: {}});
      } catch (e) { oops(e); return; }
      toast(i.label + ' is now in stock');
      try { this.products = await api('/api/products'); } catch (e) {}
      this.load();
    },
    async remove(i) {
      try { await api(this.scoped('/' + i.id), { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
    async clearDone() {
      try { await api(this.scoped('/done'), { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
    async addMissing() {
      try {
        const r = await api(this.scoped('/add-missing'), { method: 'POST' });
        toast(r.added ? 'Added ' + r.added : 'Nothing new to add');
        this.load();
      } catch (e) { oops(e); }
    },
  });
}
</script>
{% endblock %}
