{% extends "base.html" %}
{% block content %}
<div x-data="shoppingPage()">
  <div class="row page-head">
    <h1 class="grow">Shopping list</h1>
    <button @click="addMissing()">Add what's running low</button>
  </div>

  <form class="card" @submit.prevent="add()">
    <div class="ingredient-row">
      <label class="field">Item<input class="grow" aria-label="Item to add" placeholder="Add something" x-model="text" list="product-names" autocomplete="off"></label>
      <label class="field">Amount<input type="number" step="any" min="0.000001" aria-label="Amount" x-model.number="amount" required></label>
      <label class="field">Unit<select aria-label="Unit" x-model="unit_id">
        <option value="">unit</option>
        <template x-for="u in preferredUnits(units)" :key="u.id"><option :value="u.id" x-text="u.name"></option></template>
      </select></label>
      <button class="primary">Add</button>
    </div>
    <datalist id="product-names">
      <template x-for="p in products" :key="p.id"><option :value="p.name"></option></template>
    </datalist>
  </form>

  <div class="card">
    <p class="muted" x-show="!items.length">The list is empty.</p>
    <template x-for="i in items" :key="i.id">
      <div class="list-item" :style="i.done && 'opacity: .55'">
        <input type="checkbox" :aria-label="'Tick off ' + i.label" :checked="i.done" @change="toggle(i)" style="width: 1.3rem; height: 1.3rem">
        <img x-show="i.picture" :src="pic(i.picture)" class="thumb">
        <div class="grow">
          <span x-text="i.label" :style="i.done && 'text-decoration: line-through'"></span>
          <span class="muted small" x-text="i.unit ? qty(i.amount, i.unit) : num(i.amount)"></span>
          <span class="pill" x-show="!i.product_id">not a product</span>
          <div class="small muted" x-show="i.note" x-text="i.note"></div>
            <div class="small muted"><span x-show="i.origin_unknown">Origin not recorded. </span><template x-for="(source, idx) in (i.sources || [])" :key="idx"><span x-text="({manual: 'Manual addition', meal_plan: 'Meal plan', recipe: 'Recipe', low_stock: 'Low stock'})[source.kind] + (source.label ? ': ' + source.label : '') + ' (' + num(source.amount) + ') '"></span></template></div>
        </div>
        <button class="small" x-show="i.product_id" @click="bought(i)" title="Tick off and add to stock">Got it</button>
        <button class="small danger" :aria-label="'Remove ' + i.label" @click="remove(i)">Remove</button>
      </div>
    </template>
    <div class="row" style="margin-top: .6rem" x-show="items.some(i => i.done)">
      <button class="small" @click="clearDone()">Clear ticked items</button>
    </div>
  </div>
  <p class="muted small">"Got it" ticks the item off and puts it into stock in one go.</p>
</div>
<script>
function shoppingPage() {
  return {
    items: [], products: [], units: [], text: '', amount: 1, unit_id: '',
    async init() {
      [this.products, this.units] = await Promise.all([api('/api/products'), api('/api/units')]);
      this.load();
    },
    async load() {
      try { this.items = await api('/api/shopping'); } catch (e) { oops(e); }
    },
    async add() {
      const name = this.text.trim();
      if (!name) return;
      const p = this.products.find(x => x.name.toLowerCase() == name.toLowerCase());
      const body = { amount: this.amount || 1, unit_id: this.unit_id ? Number(this.unit_id) : null };
      if (p) body.product_id = p.id; else body.name = name;
      if (p && !body.unit_id) body.unit_id = p.purchase_unit_id || p.unit_id;
      try {
        await api('/api/shopping', { method: 'POST', body });
        this.text = ''; this.amount = 1; this.unit_id = '';
        this.load();
      } catch (e) { oops(e); }
    },
    async toggle(i) {
      try {
        await api('/api/shopping/' + i.id, { method: 'PUT', body: { done: !i.done } });
        this.load();
      } catch (e) { oops(e); }
    },
    async bought(i) {
      try {
        await api('/api/shopping/' + i.id + '/bought', { method: 'POST', body: {} });
        toast(i.label + ' added to stock');
        this.load();
      } catch (e) { oops(e); }
    },
    async remove(i) {
      try { await api('/api/shopping/' + i.id, { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
    async clearDone() {
      try { await api('/api/shopping/done', { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
    async addMissing() {
      try {
        const r = await api('/api/shopping/add-missing', { method: 'POST' });
        toast(r.added ? 'Added ' + r.added : 'Nothing new to add');
        this.load();
      } catch (e) { oops(e); }
    },
  };
}
</script>
{% endblock %}
