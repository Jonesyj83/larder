{% extends "base.html" %}
{% block content %}
<div class="shopping-page" x-data="shoppingPage()">
  <div class="row page-head">
    <h1 class="grow">Shopping list</h1>
    <button @click="addMissing()">Add what's running low</button>
  </div>

  <div class="card row">
    <label class="field grow">List<select x-ref="listSelect" x-model.number="list_id" @change="selectList()">
      <template x-for="list in lists" :key="list.id"><option :value="list.id" x-text="list.name + ' (' + list.item_count + ')'"></option></template>
    </select></label>
    <button @click="newList()">New list</button>
    <button @click="renameList()">Rename</button>
    <button class="danger" @click="deleteList()">Delete list</button>
  </div>

  <form class="card" @submit.prevent="add()">
    <div class="ingredient-row">
      <label class="field">Item<input class="grow" aria-label="Item to add" placeholder="Add something" x-model="text" list="product-names" autocomplete="off"></label>
      <label class="field">Amount<input type="number" step="any" min="0.000001" aria-label="Amount" x-model.number="amount" required></label>
      <label class="field">Unit<select aria-label="Unit" x-model="unit_id">
        <option value="">unit</option>
        <template x-for="u in preferredUnits(units)" :key="u.id"><option :value="u.id" x-text="u.name"></option></template>
      </select></label>
      <button class="primary">Add</button>
    </div>
    <datalist id="product-names">
      <template x-for="p in products" :key="p.id"><option :value="p.name"></option></template>
    </datalist>
  </form>

  <div class="card list-surface">
    <p class="muted" x-show="!items.length">The list is empty.</p>
    <template x-for="i in items" :key="i.id">
      <div class="list-item" :style="i.done && 'opacity: .55'">
        <input type="checkbox" :aria-label="'Tick off ' + i.label" :checked="i.done" @change="toggle(i)" class="check-item">
        <img x-show="i.picture" :src="pic(i.picture)" class="thumb">
        <div class="grow">
          <span x-text="i.label" :style="i.done && 'text-decoration: line-through'"></span>
          <span class="shopping-amount" x-text="i.unit ? qty(i.amount, i.unit) : num(i.amount)"></span>
          <span class="pill" x-show="!i.product_id">not a product</span>
          <select class="small" x-show="!i.product_id" x-model="i.unitChoice" :disabled="!!i.unit_id" aria-label="Unit for new product">
            <option value="">Choose a stock unit</option>
            <template x-for="u in units" :key="u.id"><option :value="u.id" x-text="u.name"></option></template>
          </select>
          <template x-if="i.product_id">
            <div class="small space-top-small">
              <template x-for="link in priceLinks(i)" :key="link.store">
                <div class="row small">
                  <span :class="cheapest(i, link) ? 'pill' : 'muted'" x-text="storeName(link.store) + ': ' + priceText(link.latest_check?.price)"></span>
                  <span class="small" x-show="link.latest_check?.on_special">special</span>
                  <button class="small" @click="redoMatch(i, link)">Change match</button>
                </div>
              </template>
              <button class="small" x-show="i.pricingLoaded && !priceLinks(i).length && enabledStores.length" @click="openMatch(i)">Match this item</button>
              <span class="muted" x-show="i.pricingError" x-text="i.pricingError"></span>
              <button class="small" x-show="i.pricingError" @click="loadPrices(items)">Retry prices</button>
              <template x-if="i.picker">
                <div class="card space-top-small">
                  <form @submit.prevent="searchMatches(i)">
                    <label class="field">Store<select x-model="i.picker.store" @change="i.picker.candidates = []; i.picker.version++">
                      <template x-for="store in enabledStores" :key="store.store"><option :value="store.store" x-text="storeName(store.store)"></option></template>
                    </select></label>
                    <label class="field">Search<input x-model="i.picker.query" maxlength="200" required></label>
                    <button class="small" :disabled="i.picker.busy">Search</button>
                    <button type="button" class="small" @click="i.picker = null">Cancel</button>
                  </form>
                  <p class="muted small" x-show="i.picker.message" x-text="i.picker.message"></p>
                  <template x-for="candidate in i.picker.candidates" :key="candidate.store_item_id">
                    <button class="small space-top-small" :disabled="i.picker.busy" @click="pickMatch(i, candidate)" x-text="[candidate.name, candidate.brand, candidate.size, priceText(candidate.price)].filter(Boolean).join(' · ')"></button>
                  </template>
                </div>
              </template>
            </div>
          </template>
          <div class="small muted" x-show="i.note" x-text="i.note"></div>
            <div class="small muted"><span x-show="i.origin_unknown">Origin not recorded. </span><template x-for="(source, idx) in (i.sources || [])" :key="idx"><span x-text="({manual: 'Manual addition', meal_plan: 'Meal plan', recipe: 'Recipe', low_stock: 'Low stock', suggestion: 'Recipe'})[source.kind] || 'Added' + (source.label ? ': ' + source.label : '') + ' (' + num(source.amount) + ') '"></span></template></div>
        </div>
        <button class="small" x-show="i.product_id" @click="bought(i)" title="Add to stock and remove from list">Got it</button>
        <button class="small" x-show="!i.product_id" @click="makeProduct(i)">Create product &amp; add to stock</button>
        <button class="small danger" :aria-label="'Remove ' + i.label" @click="remove(i)">Remove</button>
      </div>
    </template>
    <div class="space-top-small row" x-show="items.some(i => i.done)">
      <button class="small" @click="clearDone()">Clear ticked items</button>
    </div>
  </div>
  <p class="muted small">"Got it" puts the item into stock and removes it from this list. The checkbox just ticks it off.</p>
</div>
<script>
function shoppingPage() {
  return {
    lists: [], list_id: null, loadVersion: 0, stores: [], items: [], products: [], units: [], text: '', amount: 1, unit_id: '',
    async init() {
      [this.products, this.units] = await Promise.all([api('/api/products'), api('/api/units')]);
      try { this.list_id = Number(localStorage.getItem('shopping-list')) || null; } catch (e) {}
      await this.load();
    },
    scoped(path = '') { return '/api/shopping' + path + '?list_id=' + this.list_id; },
    async selectList() {
      try { localStorage.setItem('shopping-list', this.list_id); } catch (e) {}
      await this.load();
    },
    async newList() {
      const name = prompt('List name');
      if (!name?.trim()) return;
      try {
        const list = await api('/api/shopping/lists', {method: 'POST', body: {name}});
        this.list_id = list.id;
        await this.selectList();
      } catch (e) { oops(e); }
    },
    async renameList() {
      const name = prompt('List name', this.lists.find(l => l.id === this.list_id)?.name || '');
      if (!name?.trim()) return;
      try {
        await api('/api/shopping/lists/' + this.list_id, {method: 'PUT', body: {name}});
        await this.load();
      } catch (e) { oops(e); }
    },
    async deleteList() {
      if (!confirm('Delete this list? Its items will move to the first remaining list.')) return;
      try {
        await api('/api/shopping/lists/' + this.list_id, {method: 'DELETE'});
        await this.load();
        await this.selectList();
      } catch (e) { oops(e); }
    },
    async load() {
      try {
        const version = ++this.loadVersion;
        const lists = await api('/api/shopping/lists');
        if (version !== this.loadVersion) return;
        this.lists = lists;
        if (!lists.some(l => l.id === this.list_id)) this.list_id = lists[0].id;
        if (typeof this.$nextTick === 'function') {
          await this.$nextTick();
          if (this.$refs && this.$refs.listSelect) this.$refs.listSelect.value = this.list_id;
        }
        const items = await api(this.scoped());
        if (version !== this.loadVersion) return;
        this.items = items.map(i => ({...i, unitChoice: i.unit_id || '', links: [], pricingLoaded: false, pricingError: '', picker: null}));
        this.loadPrices(this.items);
      } catch (e) { oops(e); }
    },
    storeName(store) { return {woolworths: 'Woolworths', coles: 'Coles', aldi: 'Aldi', iga: 'IGA'}[store] || store; },
    get enabledStores() { return this.stores.filter(s => s.enabled); },
    priceLinks(i) { return (i.links || []).filter(link => this.enabledStores.some(s => s.store === link.store)); },
    priceText(price) { return price == null ? 'price not checked yet' : '$' + Number(price).toFixed(2); },
    cheapest(i, link) {
      const prices = this.priceLinks(i).map(l => l.latest_check?.price).filter(p => p != null).map(Number);
      return link.latest_check?.price != null && Number(link.latest_check.price) === Math.min(...prices);
    },
    async loadPrices(items) {
      const lookups = items.filter(i => i.product_id).map(i => this.loadPrice(i));
      try { this.stores = await api('/api/pricing/stores'); }
      catch (e) { items.filter(i => i.product_id).forEach(i => { i.pricingError = 'Store settings unavailable.'; }); }
      await Promise.all(lookups);
    },
    async loadPrice(i) {
      i.pricingError = '';
      try { i.links = await api('/api/pricing/products/' + i.product_id); i.pricingLoaded = true; }
      catch (e) { i.pricingError = 'Prices unavailable.'; }
    },
    openMatch(i, store = '') {
      const product = this.products.find(p => p.id === i.product_id);
      i.picker = {store: store || this.enabledStores[0]?.store || '', query: product?.name || i.label,
        candidates: [], busy: false, message: '', version: 0};
    },
    async searchMatches(i) {
      const picker = i.picker;
      if (!picker.query.trim() || !this.enabledStores.some(s => s.store === picker.store)) return;
      const version = ++picker.version;
      picker.busy = true; picker.message = ''; picker.candidates = [];
      try {
        const candidates = await api('/api/pricing/search?' + new URLSearchParams({store: picker.store, q: picker.query.trim()}));
        if (picker.version === version) { picker.candidates = candidates; picker.message = candidates.length ? '' : 'No matches found.'; }
      } catch (e) { if (picker.version === version) picker.message = 'Search unavailable. Try again.'; }
      finally { picker.busy = false; }
    },
    async pickMatch(i, candidate) {
      const picker = i.picker;
      picker.busy = true;
      try {
        await api('/api/pricing/products/' + i.product_id + '/link', {method: 'POST', body: {
          store: picker.store, store_item_id: candidate.store_item_id, store_name: candidate.name}});
        i.picker = null;
        await this.loadPrice(i);
      } catch (e) { picker.message = 'Could not save match. Try again.'; }
      finally { picker.busy = false; }
    },
    async redoMatch(i, link) {
      try {
        await api('/api/pricing/products/' + i.product_id + '/link/' + link.store, {method: 'DELETE'});
        await this.loadPrice(i);
        this.openMatch(i, link.store);
      } catch (e) { oops(e); }
    },
    async add() {
      const name = this.text.trim();
      if (!name) return;
      const p = this.products.find(x => x.name.toLowerCase() == name.toLowerCase());
      const body = { amount: this.amount || 1, unit_id: this.unit_id ? Number(this.unit_id) : null };
      if (p) body.product_id = p.id; else body.name = name;
      if (p && !body.unit_id) body.unit_id = p.purchase_unit_id || p.unit_id;
      try {
        await api(this.scoped(), { method: 'POST', body });
        this.text = ''; this.amount = 1; this.unit_id = '';
        this.load();
      } catch (e) { oops(e); }
    },
    async toggle(i) {
      try {
        await api(this.scoped('/' + i.id), { method: 'PUT', body: { done: !i.done } });
        this.load();
      } catch (e) { oops(e); }
    },
    async bought(i) {
      try {
        await api(this.scoped('/' + i.id + '/bought'), { method: 'POST', body: {} });
        toast(i.label + ' added to stock');
        this.load();
      } catch (e) { oops(e); }
    },
    async makeProduct(i) {
      const unit_id = Number(i.unitChoice || i.unit_id);
      if (!unit_id) { toast('Choose a stock unit first'); return; }
      const unit = i.unit || this.units.find(u => u.id == unit_id)?.name || 'unit';
      if (!confirm('Create ' + i.label + ' as a product and add ' + qty(i.amount, unit) + ' to stock?')) return;
      try {
        await api(this.scoped('/' + i.id + '/make-product'), {method: 'POST', body: {unit_id}});
      } catch (e) { oops(e); return; }
      toast(i.label + ' is now in stock');
      try { this.products = await api('/api/products'); } catch (e) {}
      this.load();
    },
    async remove(i) {
      try { await api(this.scoped('/' + i.id), { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
    async clearDone() {
      try { await api(this.scoped('/done'), { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
    async addMissing() {
      try {
        const r = await api(this.scoped('/add-missing'), { method: 'POST' });
        toast(r.added ? 'Added ' + r.added : 'Nothing new to add');
        this.load();
      } catch (e) { oops(e); }
    },
  };
}
</script>
{% endblock %}
