{% extends "base.html" %}
{% block content %}
<div x-data="scanPage()" x-init="init()">
  <div class="tabs">
    <button :class="mode == 'purchase' && 'on'" @click="setMode('purchase')">Purchase</button>
    <button :class="mode == 'consume' && 'on'" @click="setMode('consume')">Consume</button>
  </div>

  <div class="scanner">
    <video x-ref="video" playsinline muted x-show="!picture"></video>
    <img class="found" x-show="picture" :src="picture" x-cloak>
    <div class="aim" x-show="scanning && !picture"></div>
    <div class="placeholder" x-show="!scanning && !picture">
      <div>
        <button class="primary" @click="start()">Start camera</button>
        <p class="small" x-text="camErr"></p>
      </div>
    </div>
  </div>

  <div class="row" style="margin: .6rem 0">
    <form class="row grow" @submit.prevent="lookup(manual)">
      <input class="grow" x-model="manual" placeholder="Type a barcode" inputmode="numeric" autocomplete="off">
      <button>Look up</button>
    </form>
    <select x-model="engine" @change="saveEngine()" style="width: auto" title="Scanner">
      <option value="native" :disabled="!hasNative">Built-in scanner</option>
      <option value="zxing">zxing (QR, Data Matrix, more)</option>
    </select>
    <button x-show="scanning" @click="stop(true)">Stop</button>
  </div>

  <p class="muted" x-show="busy">Looking up...</p>

  <!-- known product -->
  <template x-if="product">
    <form class="card" @submit.prevent="submit()">
      <div class="row">
        <div class="grow">
          <b x-text="product.name"></b>
          <div class="small muted">
            <span x-text="'In stock: ' + qty(product.in_stock, product.unit, product.unit_plural)"></span>
            <span x-show="product.next_expiry" :class="expiry(product.next_expiry, product.shelf_life_kind).cls"
                  x-text="' - ' + expiry(product.next_expiry, product.shelf_life_kind).text"></span>
          </div>
          <div class="small muted" x-text="'Barcode ' + code"></div>
        </div>
        <a class="small" :href="'/products?id=' + product.id">edit</a>
      </div>
      <div class="grid2">
        <div>
          <label>Amount</label>
          <input type="number" step="any" min="0" x-model.number="amount" required>
        </div>
        <div>
          <label>Unit</label>
          <select x-model.number="unit_id">
            <option :value="product.unit_id" x-text="product.unit" :selected="unit_id == product.unit_id"></option>
            <template x-if="product.purchase_unit_id && product.purchase_unit_id != product.unit_id">
              <option :value="product.purchase_unit_id" :selected="unit_id == product.purchase_unit_id"
                      x-text="product.purchase_unit + ' (' + num(product.purchase_factor) + ' ' + product.unit + ')'"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div>
          <label>Location</label>
          <select x-model="location_id">
            <option value="" x-text="mode == 'consume' ? 'Anywhere' : 'Default'"></option>
            <template x-for="l in locations" :key="l.id">
              <option :value="l.id" x-text="l.name" :selected="l.id == location_id"></option>
            </template>
          </select>
        </div>
        <div x-show="mode == 'purchase'">
          <label x-text="shelfLabel(product.shelf_life_kind)"></label>
          <input type="date" x-model="expires_on">
        </div>
        <div x-show="mode == 'consume'" style="padding-top: 1.8rem">
          <label class="inline"><input type="checkbox" x-model="spoiled"> Spoiled / thrown away</label>
        </div>
      </div>
      <div class="row" style="margin-top: 1rem">
        <button class="primary" :disabled="busy"
                x-text="mode == 'purchase' ? 'Add to stock' : (spoiled ? 'Throw out' : 'Use up')"></button>
        <button type="button" @click="reset(true)">Cancel</button>
      </div>
    </form>
  </template>

  <!-- unknown barcode -->
  <template x-if="unknown">
    <div class="card">
      <b>New barcode</b> <span class="muted small" x-text="code"></span>
      <p class="small muted" x-show="unknown.off" x-text="'OpenFoodFacts says: ' + (unknown.off && unknown.off.name) + (unknown.off && unknown.off.quantity ? ' (' + unknown.off.quantity + ')' : '')"></p>
      <p class="small muted" x-show="!unknown.off">Not found on OpenFoodFacts, fill it in yourself.</p>

      <div x-show="unknown.matches && unknown.matches.length">
        <label>Same thing as one of these?</label>
        <div class="row">
          <template x-for="m in unknown.matches" :key="m.id">
            <button type="button" class="small" @click="link(m.id)" x-text="m.name"></button>
          </template>
        </div>
      </div>
      <label>Or link it to an existing product</label>
      <input placeholder="Search products" x-model="linkQ" @input.debounce.200ms="searchLink()">
      <div class="row" style="margin-top: .3rem">
        <template x-for="m in linkFound" :key="m.id">
          <button type="button" class="small" @click="link(m.id)" x-text="m.name"></button>
        </template>
      </div>

      <form @submit.prevent="create()">
        <h2>Or make a new product</h2>
        <label>Name</label>
        <input x-model="np.name" required>
        <div class="grid2">
          <div>
            <label>Count it in</label>
            <select x-model="np.unit_id">
              <template x-for="u in units" :key="u.id"><option :value="u.id" x-text="u.name" :selected="u.id == np.unit_id"></option></template>
            </select>
          </div>
          <div>
            <label>Location</label>
            <select x-model="np.location_id">
              <option value="">None</option>
              <template x-for="l in locations" :key="l.id"><option :value="l.id" x-text="l.name" :selected="l.id == np.location_id"></option></template>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div>
            <label>Bought as (optional)</label>
            <select x-model="np.purchase_unit_id">
              <option value="">Same</option>
              <template x-for="u in units" :key="u.id"><option :value="u.id" x-text="u.name"></option></template>
            </select>
          </div>
          <div x-show="np.purchase_unit_id && np.purchase_unit_id != np.unit_id">
            <label>How many in one?</label>
            <input type="number" step="any" min="0" x-model.number="np.purchase_factor">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label>Date type</label>
            <select x-model="np.shelf_life_kind">
              <option value="best_by">Best by</option>
              <option value="use_by">Use by</option>
            </select>
          </div>
          <div>
            <label>Usually keeps (days)</label>
            <input type="number" min="0" x-model="np.default_days">
          </div>
        </div>
        <label class="inline" style="margin-top: .6rem" x-show="unknown.off && unknown.off.image_url">
          <input type="checkbox" x-model="np.use_pic"> Use the OpenFoodFacts picture
        </label>
        <div class="row" style="margin-top: 1rem">
          <button class="primary" :disabled="busy">Create</button>
          <button type="button" @click="reset(true)">Cancel</button>
        </div>
      </form>
    </div>
  </template>

  <p class="muted small" x-show="!secure" x-cloak>
    The camera only works over https (or on localhost). Typing barcodes in still works.
  </p>
</div>

<script>
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code', 'data_matrix', 'itf'];

function scanPage() {
  return {
    mode: localStorage.getItem('larder.scanMode') || 'purchase',
    engine: localStorage.getItem('larder.scanEngine') || 'native',
    hasNative: 'BarcodeDetector' in window,
    secure: window.isSecureContext,
    scanning: false, camOn: false, busy: false, camErr: '', manual: '', barcodeAmount: null,
    stream: null, detector: null, zx: null, timer: null,
    code: '', product: null, unknown: null, picture: '',
    amount: 1, unit_id: null, location_id: '', expires_on: '', spoiled: false,
    units: [], locations: [], np: {}, linkQ: '', linkFound: [],

    async init() {
      if (!this.hasNative) this.engine = 'zxing';
      [this.units, this.locations] = await Promise.all([api('/api/units'), api('/api/locations')]);
      const code = new URLSearchParams(location.search).get('code');
      if (code) this.lookup(code);
    },
    setMode(m) {
      this.mode = m;
      localStorage.setItem('larder.scanMode', m);
      if (this.product) this.fillDefaults();
    },
    saveEngine() {
      localStorage.setItem('larder.scanEngine', this.engine);
      if (this.scanning) { this.stop(true); this.start(); }
    },

    // --- camera ---
    async start() {
      this.camErr = '';
      this.reset(false);
      this.camOn = true;
      try {
        if (this.engine == 'zxing') return await this.startZxing();
        this.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
        const v = this.$refs.video;
        v.srcObject = this.stream;
        await v.play();
        let formats = FORMATS;
        try {
          const supported = await BarcodeDetector.getSupportedFormats();
          formats = FORMATS.filter(f => supported.includes(f));
        } catch (e) {}
        this.detector = new BarcodeDetector({ formats });
        this.scanning = true;
        this.loop();
      } catch (e) {
        this.camErr = "Couldn't start the camera: " + (e.message || e);
        this.stop(true);
      }
    },
    async loop() {
      if (!this.scanning || !this.detector) return;
      try {
        const found = await this.detector.detect(this.$refs.video);
        if (found.length && found[0].rawValue) {
          this.gotCode(found[0].rawValue);
          return;
        }
      } catch (e) {}
      this.timer = setTimeout(() => this.loop(), 200);
    },
    async startZxing() {
      if (!window.ZXing) {
        // only pulled in when someone actually picks it
        await new Promise((ok, fail) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
          s.onload = ok;
          s.onerror = () => fail(new Error("couldn't load zxing"));
          document.head.appendChild(s);
        });
      }
      this.zx = new ZXing.BrowserMultiFormatReader();
      this.scanning = true;
      await this.zx.decodeFromConstraints(
        { video: { facingMode: 'environment' } }, this.$refs.video,
        (result) => { if (result && this.scanning) this.gotCode(result.getText()); });
    },
    stop(forGood) {
      if (forGood) this.camOn = false;
      this.scanning = false;
      clearTimeout(this.timer);
      if (this.zx) { try { this.zx.reset(); } catch (e) {} this.zx = null; }
      if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
      this.detector = null;
    },
    gotCode(code) {
      this.stop();
      if (navigator.vibrate) navigator.vibrate(60);
      this.lookup(code);
    },

    // --- lookup ---
    async lookup(code) {
      code = (code || '').trim();
      if (!code) return;
      this.stop();
      this.reset(false);
      this.code = code;
      this.busy = true;
      try {
        // barcode goes in the path, so it has to be encoded (qr codes can have / and : in them)
        const r = await api('/api/scan/' + encodeURIComponent(code));
        if (r.found) {
          this.showProduct(r.product, r.barcode_amount);
        } else {
          this.unknown = r;
          const off = r.off || {};
          const piece = this.units.find(u => u.name == 'piece') || this.units[0] || {};
          this.np = { name: off.name || '', unit_id: piece.id, location_id: this.lastLocation(code) || '',
                      purchase_unit_id: '', purchase_factor: 1, shelf_life_kind: 'best_by',
                      default_days: '', use_pic: !!off.image_url };
          this.picture = off.image_url || '';
        }
      } catch (e) { oops(e); }
      this.busy = false;
    },
    showProduct(p, barcodeAmount) {
      this.product = p;
      this.barcodeAmount = barcodeAmount;
      this.unknown = null;
      this.picture = pic(p.picture);
      this.fillDefaults();
    },
    fillDefaults() {
      const p = this.product;
      if (this.barcodeAmount) {
        this.amount = this.barcodeAmount;
        this.unit_id = p.unit_id;
      } else if (this.mode == 'purchase' && p.purchase_unit_id) {
        this.amount = 1;
        this.unit_id = p.purchase_unit_id;
      } else {
        this.amount = 1;
        this.unit_id = p.unit_id;
      }
      this.location_id = this.mode == 'purchase' ? (this.lastLocation(this.code) || '') : '';
      this.expires_on = p.default_days ? addDays(today(), p.default_days) : '';
      this.spoiled = false;
    },
    lastLocation(code) {
      return localStorage.getItem('larder.loc.' + code) || '';
    },

    async submit() {
      this.busy = true;
      const body = { product_id: this.product.id, amount: this.amount, unit_id: this.unit_id,
                     location_id: this.location_id ? Number(this.location_id) : null };
      try {
        if (this.mode == 'purchase') {
          body.expires_on = this.expires_on || null;
          const r = await api('/api/stock/purchase', { method: 'POST', body });
          if (this.location_id) localStorage.setItem('larder.loc.' + this.code, this.location_id);
          toast('Added ' + qty(r.added, this.product.unit, this.product.unit_plural) + ' ' + this.product.name);
        } else {
          body.spoiled = this.spoiled;
          const r = await api('/api/stock/consume', { method: 'POST', body });
          toast((this.spoiled ? 'Threw out ' : 'Used ') + qty(r.removed, this.product.unit, this.product.unit_plural)
                + ' ' + this.product.name + ', ' + num(r.in_stock) + ' left');
        }
        this.busy = false;
        this.reset(true);
      } catch (e) { oops(e); this.busy = false; }
    },

    async create() {
      this.busy = true;
      const n = this.np;
      const body = {
        name: n.name, unit_id: Number(n.unit_id),
        location_id: n.location_id ? Number(n.location_id) : null,
        purchase_unit_id: n.purchase_unit_id ? Number(n.purchase_unit_id) : null,
        purchase_factor: (n.purchase_unit_id && n.purchase_unit_id != n.unit_id) ? Number(n.purchase_factor || 1) : 1,
        shelf_life_kind: n.shelf_life_kind,
        default_days: n.default_days === '' ? null : Number(n.default_days),
        barcodes: [this.code],
        picture_url: (n.use_pic && this.unknown.off) ? this.unknown.off.image_url : null,
      };
      try {
        const p = await api('/api/products', { method: 'POST', body });
        toast('Made ' + p.name);
        this.showProduct(p, null);
      } catch (e) { oops(e); }
      this.busy = false;
    },
    async link(productId) {
      try {
        let p = await api('/api/products/' + productId + '/barcodes', { method: 'POST', body: { code: this.code } });
        const off = this.unknown && this.unknown.off;
        if (!p.picture && off && off.image_url) {
          // product had no picture yet, borrow the one from OpenFoodFacts
          try {
            p = await api('/api/products/' + productId + '/picture-url', { method: 'POST', body: { url: off.image_url } });
          } catch (e) {}
        }
        toast('Barcode saved to ' + p.name);
        this.showProduct(p, null);
      } catch (e) { oops(e); }
    },
    async searchLink() {
      this.linkFound = this.linkQ ? (await api('/api/products?q=' + encodeURIComponent(this.linkQ))).slice(0, 10) : [];
    },

    reset(restart) {
      this.product = null; this.unknown = null; this.picture = ''; this.manual = '';
      this.linkQ = ''; this.linkFound = []; this.barcodeAmount = null;
      // go straight back to scanning if the camera was in use
      if (restart && this.camOn && !this.scanning) this.start();
    },
  };
}
</script>
{% endblock %}
