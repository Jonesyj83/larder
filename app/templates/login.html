{% extends "base.html" %}
{% block content %}
<div x-data="loginPage()" x-init="init()" style="max-width: 360px; margin: 3rem auto">
  <h1>Larder</h1>
  <div class="card">
    <p x-show="setup" x-cloak class="muted">First run. Make an account, it'll be the admin one.</p>
    <form @submit.prevent="go()">
      <label>Username</label>
      <input x-model="username" autocomplete="username" autofocus required>
      <label>Password</label>
      <input type="password" x-model="password" :autocomplete="setup ? 'new-password' : 'current-password'" required>
      <p class="bad small" x-text="err"></p>
      <button class="primary" :disabled="busy" x-text="setup ? 'Create account' : 'Log in'"></button>
    </form>
  </div>
</div>
<script>
function loginPage() {
  return {
    username: '', password: '', err: '', setup: false, busy: false,
    async init() {
      const s = await api('/api/auth/status');
      this.setup = s.needs_setup;
    },
    async go() {
      this.err = ''; this.busy = true;
      try {
        await api(this.setup ? '/api/auth/setup' : '/api/auth/login', {
          method: 'POST', body: { username: this.username, password: this.password } });
        location.href = '/';
      } catch (e) {
        this.err = e.message;
      }
      this.busy = false;
    },
  };
}
</script>
{% endblock %}
