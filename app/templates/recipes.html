{% from '_date_field.html' import date_field %}
{% extends "base.html" %}
{% block content %}
<div x-data="recipesPage()">
  <div class="row page-head">
    <h1 class="grow">Recipes</h1>
    <button class="primary" @click="edit(null)">New recipe</button>
  </div>

  <!-- list -->
  <div x-show="!current">
    <div class="row toolbar">
      <div class="seg" role="group" aria-label="Filter recipes">
        <button type="button" :class="{on: filter == 'all'}" @click="filter = 'all'">All</button>
        <button type="button" :class="{on: filter == 'ready'}" @click="filter = 'ready'">Can make</button>
        <button type="button" :class="{on: filter == 'missing'}" @click="filter = 'missing'">Missing ingredients</button>
      </div>
    </div>
    <p class="muted" x-show="loaded && !recipes.length" x-cloak>No recipes yet.</p>
    <p class="muted" x-show="loaded && recipes.length && !shown().length" x-cloak>No saved recipes match that filter.</p>
    <div class="recipe-grid">
      <template x-for="r in shown()" :key="r.id">
        <a class="recipe-card" :href="BASE + '/recipes?id=' + r.id" @click.prevent="open(r.id)">
          <div class="recipe-thumb" :class="{empty: !r.picture}">
            <img x-show="r.picture" :src="pic(r.picture)" alt="">
          </div>
          <b x-text="r.name"></b>
          <div class="small muted" x-text="num(r.servings) + ' servings, ' + r.ingredient_count + ' ingredients'"></div>
          <div class="space-top-small row">
            <span class="stars small" x-text="stars(r.rating)" x-show="r.rating"></span>
            <span class="spacer grow"></span>
            <span x-show="r.can_make" class="ok small">can make it</span>
            <span x-show="!r.can_make && r.ingredient_count" class="warn small" x-text="r.missing_count + ' missing'"></span>
          </div>
        </a>
      </template>
    </div>
  </div>

  <!-- one recipe -->
  <template x-if="current">
    <div>
      <p><a href="{{ base_path }}/recipes" @click.prevent="close()">&larr; all recipes</a></p>
      <div class="card">
        <div class="recipe-banner" x-show="current.picture"><img :src="pic(current.picture)" alt=""></div>
        <div class="row">
          <h2 class="no-margin grow" x-text="current.name"></h2>
          <span x-show="current.can_make" class="ok">You've got everything</span>
          <span x-show="!current.can_make && current.ingredients.length" class="warn" x-text="current.missing_count + ' missing'"></span>
        </div>
        <div class="space-block-small row">
          <span class="muted small">Rate it</span>
          <template x-for="n in [1,2,3,4,5]" :key="n">
            <button type="button" class="star-btn" :aria-label="'Rate ' + n + ' stars'" @click="rate(n)" x-text="n <= current.rating ? '★' : '☆'"></button>
          </template>
          <button type="button" class="small" x-show="current.rating" @click="rate(0)">Clear</button>
        </div>
        <div class="space-block-small row">
          <span>Servings</span>
          <input aria-label="Recipe servings" type="number" step="any" min="0.000001" x-model.number="servings" @change="open(current.id)" class="serving-input">
          <span class="muted small" x-show="servings != current.servings" x-text="'(recipe is for ' + num(current.servings) + ')'"></span>
        </div>
        <p class="muted" x-show="!current.ingredients.length">No ingredients recorded. Edit this recipe to check what you need.</p>
        <table>
          <tr><th>Ingredient</th><th>Needs</th><th class="hide-small">Have</th><th></th></tr>
          <template x-for="i in current.ingredients" :key="i.id">
            <tr>
              <td><span x-text="i.name"></span> <span class="muted small" x-text="i.note"></span><span class="only-small small muted" x-text="'Have ' + qty(i.have, i.stock_unit)"></span></td>
              <td x-text="qty(i.amount_scaled, i.unit)"></td>
              <td class="hide-small" x-text="qty(i.have, i.stock_unit)"></td>
              <td>
                <span x-show="i.enough" class="ok small">ok</span>
                <span x-show="!i.enough && i.missing !== null" class="bad small" x-text="'short ' + qty(i.missing, i.stock_unit)"></span>
                <span x-show="i.error" class="bad small" x-text="i.error"></span>
              </td>
            </tr>
          </template>
        </table>
        <div class="space-top row">
          <button x-show="!current.can_make" @click="toShopping()">Put missing on shopping list</button>
          <button @click="cookOpen = true; cook.leftover = Math.max(0, Math.round((servings - portionFactor()) * 100) / 100) || ''; cook.location_id = ''">Cooked it (take from stock)</button>
          <button @click="planOpen = true">Add to meal plan</button>
          <span class="spacer grow"></span>
          <button @click="edit(current)">Edit</button>
          <button class="danger" @click="remove()">Delete</button>
        </div>
      </div>
      <div class="card" x-show="current.instructions">
        <pre class="instructions" x-text="current.instructions"></pre>
      </div>

      <!-- cook it -->
      <template x-if="cookOpen">
        <div class="modal-bg" @click.self="cookOpen = false">
          <form class="modal" @submit.prevent="doCook()">
            <b>Cooked it</b>
            <p class="small muted">Takes the ingredients for {{ '' }}<span x-text="num(servings)"></span> servings out of stock.</p>
            <label class="field">Any portions left over?<input type="number" step="any" min="0" x-model.number="cook.leftover" placeholder="0"></label>
            <p class="small muted" x-show="cook.leftover > 0" x-cloak>Worked out from the servings above against your portion size - change it if that's not right tonight.</p>
            <label class="field" x-show="cook.leftover > 0" x-cloak>Where are they going?
              <select x-model.number="cook.location_id" :required="cook.leftover > 0">
                <option value="">Choose a location</option>
                <template x-for="l in locations" :key="l.id"><option :value="l.id" x-text="l.name"></option></template>
              </select>
            </label>
            <div class="space-top row">
              <button class="primary">Cook it</button>
              <button type="button" @click="cookOpen = false">Cancel</button>
            </div>
          </form>
        </div>
      </template>

      <template x-if="planOpen">
        <div class="modal-bg" @click.self="planOpen = false">
          <form class="modal" @submit.prevent="addToPlan()">
            <b>Add to meal plan</b>
            <div class="grid2">
              <div><label>Day</label>{{ date_field('plan.day', 'Date', true) }}</div>
              <div>
                <label class="field">Meal<select x-model="plan.slot">
                  <template x-for="s in slots"><option :value="s" x-text="s"></option></template>
                </select></label>
              </div>
            </div>
            <label class="field">Servings<input type="number" step="any" min="0.000001" x-model.number="plan.servings"></label>
            <div class="space-top row">
              <button class="primary">Add</button>
              <button type="button" @click="planOpen = false">Cancel</button>
            </div>
          </form>
        </div>
      </template>
    </div>
  </template>

  <!-- editor -->
  <template x-if="form">
    <div class="modal-bg" @click.self="form = null">
      <form class="modal" @submit.prevent="save()">
        <b x-text="form.id ? 'Edit recipe' : 'New recipe'"></b>
        <div class="grid2">
          <div><label class="field">Name<input x-model="form.name" required></label></div>
          <div><label class="field">Servings<input type="number" step="any" min="0.25" x-model.number="form.servings" required></label></div>
        </div>
        <label>Ingredients</label><p class="warn small" x-show="form.reviewing">Proposed recipe: review amounts and units. Unknown units require correction. Saving adds no stock or shopping.</p>
        <template x-for="(i, idx) in form.ingredients" :key="idx">
          <div class="ingredient-row">
            <div class="ingredient-product field">
              <label>Catalogue product
                <select x-model="i.product_id" @change="selectIngredient(i, products)">
                  <option value="">New ingredient (no stock)</option>
                  <template x-for="p in products" :key="p.id"><option :value="p.id" x-text="p.name + ' — on hand: ' + num(p.in_stock) + ' ' + p.unit"></option></template>
                </select>
              </label>
              <label x-show="!i.product_id">Ingredient name
                <input x-model="i.name" :required="!i.product_id" :disabled="!!i.product_id" placeholder="e.g. Bread">
              </label>
            </div>
            <label class="field">Amount<input type="number" step="any" min="0.000001" x-model.number="i.amount" required></label>
            <label class="field">Unit<select x-model="i.unit_id" required>
              <option value="">Choose unit</option><template x-for="u in preferredUnits(units)" :key="u.id"><option :value="u.id" x-text="u.name"></option></template>
            </select></label>
            <button type="button" class="small danger" @click="form.ingredients.splice(idx, 1)" aria-label="Remove ingredient">Remove</button>
            <p class="warn small ingredient-note" x-show="i.unit && !i.unit_id" x-text="'Proposed unit: ' + i.unit + '. Choose a valid unit.'"></p>
            <label class="field ingredient-note">Ingredient note (optional)<input x-model="i.note"></label>
          </div>
        </template>
        <button type="button" class="small" @click="form.ingredients.push({product_id: '', name: '', amount: 1, unit_id: '', note: ''})">+ ingredient</button>
        <p class="muted small">New ingredients are saved to the catalogue only when you save. This adds no stock. If a name already exists, choose that catalogue product above. Units and names can be edited in Products.</p>
        <label class="field">Method<textarea x-model="form.instructions"></textarea></label>
        <div class="space-top row">
          <button class="primary" :disabled="busy" x-text="form.reviewing ? 'Save reviewed ingredients' : 'Save'"></button>
          <button type="button" @click="form = null">Cancel</button>
        </div>
      </form>
    </div>
  </template>

</div>
<script>
function recipesPage() {
  return {
    recipes: [], products: [], units: [], locations: [], loaded: false, filter: 'all',
    current: null, servings: null, form: null, busy: false,
    slots: ['breakfast', 'lunch', 'dinner', 'snack', 'dessert'],
    planOpen: false, plan: { day: today(), slot: 'dinner', servings: null },
    cookOpen: false, cook: { leftover: '', location_id: '' },

    async init() {
      [this.products, this.units, this.locations] = await Promise.all([api('/api/products'), api('/api/units'), api('/api/locations')]);
      await this.load();
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const planned = Number(params.get('servings'));
      if (id) {
        await this.open(id, Number.isFinite(planned) && planned > 0 ? planned : null);
      }
    },
    async load() {
      try { this.recipes = await api('/api/recipes/makeable'); this.loaded = true; } catch (e) { oops(e); }
    },
    shown() {
      if (this.filter == 'ready') return this.recipes.filter(r => r.can_make);
      if (this.filter == 'missing') return this.recipes.filter(r => !r.can_make && r.ingredient_count);
      return this.recipes;
    },
    stars(n) { return '★'.repeat(n || 0); },
    async open(id, wanted = null) {
      try {
        const same = this.current && this.current.id == id;
        const servingsWanted = wanted || (same ? this.servings : null);
        const q = servingsWanted ? '?servings=' + servingsWanted : '';
        this.current = await api('/api/recipes/' + id + q);
        this.servings = this.current.servings_wanted;
        this.plan.servings = this.servings;
        history.replaceState(null, '', BASE + '/recipes?id=' + id + (servingsWanted ? '&servings=' + servingsWanted : ''));
      } catch (e) { oops(e); }
    },
    close() {
      this.current = null;
      history.replaceState(null, '', BASE + '/recipes');
      this.load();
    },
    pickProduct(i) {
      const p = this.products.find(x => x.id == i.product_id);
      if (p && !i.unit_id) i.unit_id = p.unit_id;
    },
    edit(r) {
      if (!r) {
        this.form = { request_id: saveRequestId(), id: null, name: '', servings: 2, instructions: '', ingredients: [{ product_id: '', name: '', amount: 1, unit_id: '', note: '' }] };
      } else {
        this.form = { request_id: saveRequestId(), id: r.id, name: r.name, servings: r.servings, instructions: r.instructions,
          ingredients: r.ingredients.map(i => ({ product_id: i.product_id, amount: i.amount, unit_id: i.unit_id || i.stock_unit_id, note: i.note })) };
      }
    },
    async save() {
      if (this.busy) return;
      this.busy = true;
      const f = this.form;
      const body = { request_id: f.request_id, name: f.name, servings: f.servings, instructions: f.instructions,
        ingredients: f.ingredients.map(ingredientBody) };
      try {
        const r = f.id ? await api('/api/recipes/' + f.id, { method: 'PUT', body })
                       : await api('/api/recipes', { method: 'POST', body });
        this.form = null;
        this.products = await api('/api/products');
        this.servings = null;
        this.current = null;
        await this.open(r.id);
        this.load();
      } catch (e) { oops(e); }
      this.busy = false;
    },
    async remove() {
      if (!confirm('Delete ' + this.current.name + '?')) return;
      try { await api('/api/recipes/' + this.current.id, { method: 'DELETE' }); this.close(); } catch (e) { oops(e); }
    },
    async rate(n) {
      try {
        await api('/api/recipes/' + this.current.id + '/rating', { method: 'PUT', body: { rating: n } });
        this.current.rating = n;
        const r = this.recipes.find(x => x.id == this.current.id);
        if (r) r.rating = n;
      } catch (e) { oops(e); }
    },
    async toShopping() {
      try {
        const r = await api('/api/recipes/' + this.current.id + '/shopping?servings=' + this.servings, { method: 'POST' });
        toast('Added ' + r.added + ' to the shopping list' + (r.problems?.length ? '. Check unit conversions: ' + r.problems.join('; ') : ''), !!r.problems?.length);
      } catch (e) { oops(e); }
    },
    async doCook() {
      try {
        const leftover = this.cook.leftover === '' ? 0 : Number(this.cook.leftover);
        let url = '/api/recipes/' + this.current.id + '/cook?servings=' + this.servings;
        if (leftover > 0) url += '&leftover_portions=' + leftover + '&location_id=' + this.cook.location_id;
        const r = await api(url, { method: 'POST' });
        toast('Used ' + r.used.length + ' ingredients' + (r.skipped.length ? ', skipped ' + r.skipped.join(', ') : '')
          + (r.batch ? '. Stored ' + num(r.batch.portions_left) + ' portions in the ' + r.batch.location + ' as ' + r.batch.code + ' - write that on the container.' : ''));
        this.cookOpen = false;
        this.open(this.current.id);
      } catch (e) { oops(e); }
    },
    async addToPlan() {
      try {
        await api('/api/mealplan', { method: 'POST', body: { day: this.plan.day, slot: this.plan.slot,
          recipe_id: this.current.id, servings: this.plan.servings === '' || this.plan.servings == null ? null : Number(this.plan.servings) } });
        this.planOpen = false;
        toast('Added to the meal plan');
      } catch (e) { oops(e); }
    },
  };
}
</script>
{% endblock %}
