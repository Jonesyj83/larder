{% extends "base.html" %}
{% block content %}
<div class="shopping-page" x-data="shoppingPage()">
  <div class="page-head">
    <h1>Shopping lists</h1>
    <div class="list-switcher">
      <label class="field no-margin">List<select x-ref="listSelect" x-model.number="list_id" @change="selectList()">
        <template x-for="list in lists" :key="list.id"><option :value="list.id" x-text="list.name + ' (' + list.item_count + ')'"></option></template>
      </select></label>
      <button class="btn-ghost" @click="newList()">New list</button>
      <button class="btn-ghost" @click="renameList()" :disabled="!list_id">Rename</button>
      <button class="btn-ghost danger" @click="deleteList()" :disabled="lists.length < 2">Delete list</button>
    </div>
  </div>

  <form class="add-bar" x-show="list_id" @submit.prevent="add()">
    <span class="search-icon" aria-hidden="true">🔍</span>
    <input class="grow" aria-label="Item to add" placeholder="Add an item — try “milk”, “pasta sauce”, “paper towel”…" x-model="text" list="product-names" autocomplete="off">
    <span class="divider"></span>
    <input class="qty-mini" type="number" step="any" min="0.000001" aria-label="Amount" x-model.number="amount" required>
    <button class="primary" type="submit">Add</button>
    <datalist id="product-names">
      <template x-for="p in products" :key="p.id"><option :value="p.name"></option></template>
    </datalist>
  </form>

  <section class="list-surface plain-lists">
    <div class="state-block" x-show="!items.length"><h3>This list is empty</h3><p x-text="list_id ? 'Add an item above.' : 'Create a shopping list to get started.'"></p></div>
    <template x-for="i in items" :key="i.id">
      <div class="shop-row plain-row" :class="i.done ? 'is-done' : ''">
        <input type="checkbox" class="check-item" :aria-label="'Tick off ' + i.label" :checked="i.done" @change="toggle(i)">
        <span class="shop-name" x-text="i.label"></span>
        <div class="qty-stepper">
          <button type="button" aria-label="Decrease quantity" @click="step(i, -1)">–</button>
          <input type="number" min="0.000001" step="any" :aria-label="'Quantity for ' + i.label" x-model.number="i.amount" @change="updateAmount(i)">
          <button type="button" aria-label="Increase quantity" @click="step(i, 1)">+</button>
        </div>
        <div class="shop-actions">
          <button class="small" x-show="i.product_id" @click="bought(i)">Got it</button>
          <button class="icon-btn danger-btn" :aria-label="'Remove ' + i.label" @click="remove(i)">✕</button>
        </div>
      </div>
    </template>
    <button class="small" x-show="items.some(i => i.done)" @click="clearDone()">Clear ticked items</button>
  </section>
  <p class="muted small">"Got it" adds linked products to stock and removes them from this list. The checkbox just ticks an item off.</p>
</div>
<script>
function shoppingPage() {
  return {
    lists: [], list_id: null, loadVersion: 0, items: [], products: [], text: '', amount: 1,
    async init() {
      this.products = await api('/api/products');
      try { this.list_id = Number(localStorage.getItem('shopping-list')) || null; } catch (e) {}
      await this.load();
    },
    scoped(path = '') { return '/api/shopping' + path + '?list_id=' + this.list_id; },
    async selectList() {
      try { localStorage.setItem('shopping-list', this.list_id); } catch (e) {}
      await this.load();
    },
    async newList() {
      const name = prompt('List name');
      if (!name?.trim()) return;
      try {
        const list = await api('/api/shopping/lists', {method: 'POST', body: {name}});
        this.list_id = list.id;
        await this.selectList();
      } catch (e) { oops(e); }
    },
    async renameList() {
      const name = prompt('List name', this.lists.find(l => l.id === this.list_id)?.name || '');
      if (!name?.trim()) return;
      try {
        await api('/api/shopping/lists/' + this.list_id, {method: 'PUT', body: {name}});
        await this.load();
      } catch (e) { oops(e); }
    },
    async deleteList() {
      if (!confirm('Delete this list? Its items will move to another shopping list.')) return;
      try {
        await api('/api/shopping/lists/' + this.list_id, {method: 'DELETE'});
        await this.load();
        await this.selectList();
      } catch (e) { oops(e); }
    },
    async load() {
      try {
        const version = ++this.loadVersion;
        const lists = await api('/api/shopping/lists?kind=plain');
        if (version !== this.loadVersion) return;
        this.lists = lists;
        if (!lists.some(l => l.id === this.list_id)) this.list_id = lists[0]?.id || null;
        if (typeof this.$nextTick === 'function') {
          await this.$nextTick();
          if (this.$refs && this.$refs.listSelect) this.$refs.listSelect.value = this.list_id;
        }
        if (!this.list_id) { this.items = []; return; }
        const items = await api(this.scoped());
        if (version !== this.loadVersion) return;
        this.items = items;
      } catch (e) { oops(e); }
    },
    step(i, delta) {
      const next = Math.max(1, (Number(i.amount) || 0) + delta);
      i.amount = next;
      this.updateAmount(i);
    },
    async updateAmount(i) {
      try {
        await api(this.scoped('/' + i.id), {method: 'PUT', body: {amount: i.amount}});
        await this.load();
      } catch (e) { oops(e); await this.load(); }
    },
    async add() {
      const name = this.text.trim();
      if (!name) return;
      const p = this.products.find(x => x.name.toLowerCase() == name.toLowerCase());
      const body = { amount: this.amount || 1 };
      if (p) body.product_id = p.id; else body.name = name;
      try {
        await api(this.scoped(), { method: 'POST', body });
        this.text = ''; this.amount = 1;
        this.load();
      } catch (e) { oops(e); }
    },
    async toggle(i) {
      try {
        await api(this.scoped('/' + i.id), { method: 'PUT', body: { done: !i.done } });
        this.load();
      } catch (e) { oops(e); }
    },
    async bought(i) {
      try {
        await api(this.scoped('/' + i.id + '/bought'), { method: 'POST', body: {} });
        toast(i.label + ' added to stock');
        this.load();
      } catch (e) { oops(e); }
    },
    async remove(i) {
      try { await api(this.scoped('/' + i.id), { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
    async clearDone() {
      try { await api(this.scoped('/done'), { method: 'DELETE' }); this.load(); } catch (e) { oops(e); }
    },
  };
}
</script>
{% endblock %}
