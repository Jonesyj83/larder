{% extends "base.html" %}
{% block content %}
<div x-data="memoryPage()">
  <div class="row page-head"><h1 class="grow" x-text="activeGroup ? activeGroup.label : 'Memory'"></h1></div>
  <p class="muted" x-show="!activeGroup">Household food preferences, habits and notes.</p>
  <label class="field">Search notes<input type="search" x-model="query" @input.debounce.250ms="load()" placeholder="Search all notes"></label>
  <div class="card">
    <p class="muted small" x-show="loaded && !visibleNotes.length" x-text="searching ? 'No matching notes.' : (activeGroup ? 'No notes in this category yet.' : 'No notes yet.')"></p>
    <template x-for="note in visibleNotes" :key="note.id">
      <div class="list-item">
        <span class="muted small" x-text="kindLabel(note.kind)" x-show="!activeKind || searching"></span>
        <template x-if="editing !== note.id">
          <button class="grow compact-note" @click="edit(note)" :aria-label="'Edit note: ' + note.content" x-text="compactNote(note.content)"></button>
        </template>
        <template x-if="editing === note.id">
          <form class="grow" @submit.prevent="save(note)">
            <label class="field">Note<textarea x-model="draft" required></textarea></label>
            <div class="row">
              <button class="primary small" :disabled="busy">Save</button>
              <button type="button" class="small" :disabled="busy" @click="editing = null">Cancel</button>
              <button type="button" class="small danger" @click="remove(note)" :disabled="busy" :aria-label="'Delete note: ' + note.content">Delete</button>
            </div>
          </form>
        </template>
      </div>
    </template>
    <button class="link-head small" x-show="!searching && !showAll && notesForCurrent.length > 5" @click="showAll = true" x-text="'Show all ' + notesForCurrent.length"></button>
    <form class="row" @submit.prevent="add(activeKind || newKind)">
      <label class="field" x-show="!activeKind"><span>Category</span><select x-model="newKind"><template x-for="group in kinds" :key="group.kind"><option :value="group.kind" x-text="group.label"></option></template></select></label>
      <label class="field grow"><span x-text="activeGroup ? 'Add ' + activeGroup.label.toLowerCase() + ' note' : 'Add a note'"></span><input x-model="newContent" required></label>
      <button class="small" :disabled="busy">Add</button>
    </form>
  </div>
</div>
<script>
function memoryPage() {
  return {
    query: '', activeKind: '', newKind: 'like', newContent: '', request: 0,
    showAll: false,
    get activeGroup() { return this.kinds.find(group => group.kind === this.activeKind) || null; },
    get searching() { return !!this.query.trim(); },
    get notesForCurrent() { return this.notes.filter(note => !this.activeKind || note.kind === this.activeKind); },
    get visibleNotes() {
      const notes = this.searching ? this.notes : this.notesForCurrent;
      return this.searching || this.showAll ? notes : notes.slice(0, 5);
    },
    notes: [], loaded: false, editing: null, draft: '', busy: false,
    kinds: [
      {kind: 'like', label: 'Likes'}, {kind: 'dislike', label: 'Dislikes'},
      {kind: 'maybe', label: 'Maybes'}, {kind: 'condition', label: 'Conditions'},
      {kind: 'habit', label: 'Habits'}, {kind: 'buying_pattern', label: 'Buying patterns'},
      {kind: 'recipe_note', label: 'Recipe notes'}, {kind: 'cost_note', label: 'Cost notes'},
    ],
    async init() {
      const kind = new URLSearchParams(location.search).get('kind');
      if (this.kinds.some(group => group.kind === kind)) this.activeKind = kind;
      await this.load();
    },
    async load() {
      const request = ++this.request;
      this.loaded = false;
      try {
        const notes = await api('/api/memory' + (this.searching ? '?q=' + encodeURIComponent(this.query.trim()) : ''));
        if (request === this.request) { this.notes = notes; this.loaded = true; }
      } catch (e) { if (request === this.request) oops(e); }
    },
    kindLabel(kind) { return this.kinds.find(group => group.kind === kind)?.label || kind; },
    edit(note) { if (!this.busy) { this.editing = note.id; this.draft = note.content; } },
    async add(kind) {
      if (this.busy) return;
      const content = (this.newContent || '').trim();
      if (!content || !kind) return;
      this.busy = true;
      try {
        const note = await api('/api/memory', {method: 'POST', body: {kind, content, source: 'manual'}});
        this.notes.unshift(note); this.newContent = ''; toast('Added');
      } catch (e) { oops(e); }
      finally { this.busy = false; }
    },
    async save(note) {
      if (this.busy || !this.draft.trim()) return;
      this.busy = true;
      try {
        const saved = await api('/api/memory/' + note.id, {method: 'PUT', body: {content: this.draft.trim()}});
        this.notes = this.notes.map(item => item.id === note.id ? saved : item);
        this.editing = null; await this.load(); toast('Saved');
      } catch (e) { oops(e); }
      finally { this.busy = false; }
    },
    async remove(note) {
      if (this.busy || !confirm('Delete this note?')) return;
      this.busy = true;
      try {
        await api('/api/memory/' + note.id, {method: 'DELETE'});
        this.notes = this.notes.filter(item => item.id !== note.id);
        if (this.editing === note.id) this.editing = null;
        toast('Deleted');
      } catch (e) { oops(e); }
      finally { this.busy = false; }
    },
  };
}
</script>
{% endblock %}
