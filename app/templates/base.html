<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} - Larder</title>
<script>window.BASE_PATH = {{ base_path | tojson }};
window.UNIT_RULES = {{ (unit_rules | default(none)) | tojson }};
window.USER_PREFS = {date_format: {{ (user.date_format | default('DD/MM/YYYY')) | tojson }}, measurement_system: {{ (user.measurement_system | default('metric')) | tojson }}, show_prices: {{ (user.show_prices | default(false)) | tojson }}, portion_size: {{ (user.portion_size | default('regular')) | tojson }}};</script>
<link rel="manifest" href="{{ base_path }}/manifest.webmanifest">
<meta name="theme-color" content="#171d25">
<link rel="icon" href="{{ base_path }}/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ base_path }}/icon-192.png">
<link rel="stylesheet" href="{{ base_path }}/static/style.css">
<script src="{{ base_path }}/static/app.js?v=2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
{% if user %}
{% set here = request.url.path %}
<header class="top">
  <a class="brand" href="{{ base_path }}/">Larder</a>
  <nav aria-label="Main navigation">
  <a class="nav {{ 'on' if here == base_path + '/' or here == base_path }}" aria-current="{{ 'page' if here == base_path + '/' or here == base_path else 'false' }}" href="{{ base_path }}/">Stock</a>
  <a class="nav {{ 'on' if here == base_path + '/expiring' }}" aria-current="{{ 'page' if here == base_path + '/expiring' else 'false' }}" href="{{ base_path }}/expiring">Use by</a>
  <a class="nav {{ 'on' if here == base_path + '/scan' }}" aria-current="{{ 'page' if here == base_path + '/scan' else 'false' }}" href="{{ base_path }}/scan">Scan</a>
  <a class="nav {{ 'on' if here == base_path + '/shopping' }}" aria-current="{{ 'page' if here == base_path + '/shopping' else 'false' }}" href="{{ base_path }}/shopping">Shopping</a>
  <a class="nav {{ 'on' if here.startswith(base_path + '/recipes') }}" aria-current="{{ 'page' if here.startswith(base_path + '/recipes') else 'false' }}" href="{{ base_path }}/recipes">Recipes</a>
  <a class="nav {{ 'on' if here == base_path + '/mealplan' }}" aria-current="{{ 'page' if here == base_path + '/mealplan' else 'false' }}" href="{{ base_path }}/mealplan">Meal plan</a>
  <a class="nav {{ 'on' if here == base_path + '/manage' }}" aria-current="{{ 'page' if here == base_path + '/manage' else 'false' }}" href="{{ base_path }}/manage">Locations &amp; units</a>
  <a class="nav {{ 'on' if here == base_path + '/memory' }}" aria-current="{{ 'page' if here == base_path + '/memory' else 'false' }}" href="{{ base_path }}/memory">Memory</a>
  </nav>
  <div class="account">
  <a class="nav {{ 'on' if here == base_path + '/settings' }}" aria-current="{{ 'page' if here == base_path + '/settings' else 'false' }}" href="{{ base_path }}/settings" aria-label="Settings for {{ user.username }}">Settings</a>
  <a class="nav" href="#" onclick="logout(); return false">Log out</a>
  </div>
</header>
{% endif %}
<main id="main">
{% block content %}{% endblock %}
</main>
<div x-data x-cloak x-show="$store.toast.msg" class="toast" :class="$store.toast.bad && 'bad'"
     x-text="$store.toast.msg" @click="$store.toast.msg = ''"></div>
</body>
</html>
