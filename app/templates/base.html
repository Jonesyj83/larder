<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} - Larder</title>
<script>window.BASE_PATH = {{ base_path | tojson }};</script>
<link rel="manifest" href="{{ base_path }}/manifest.webmanifest">
<meta name="theme-color" content="#2f6f4f">
<link rel="icon" href="{{ base_path }}/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ base_path }}/icon-192.png">
<link rel="stylesheet" href="{{ base_path }}/static/style.css">
<script src="{{ base_path }}/static/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
{% if user %}
{% set here = request.url.path %}
<header class="top">
  <a class="brand" href="{{ base_path }}/">Larder</a>
  <a class="nav {{ 'on' if here == base_path + '/' or here == base_path }}" href="{{ base_path }}/">Stock</a>
  <a class="nav {{ 'on' if here == base_path + '/scan' }}" href="{{ base_path }}/scan">Scan</a>
  <a class="nav {{ 'on' if here == base_path + '/shopping' }}" href="{{ base_path }}/shopping">Shopping</a>
  <a class="nav {{ 'on' if here.startswith(base_path + '/recipes') }}" href="{{ base_path }}/recipes">Recipes</a>
  <a class="nav {{ 'on' if here == base_path + '/mealplan' }}" href="{{ base_path }}/mealplan">Meal plan</a>
  <a class="nav {{ 'on' if here == base_path + '/products' }}" href="{{ base_path }}/products">Products</a>
  <a class="nav {{ 'on' if here == base_path + '/manage' }}" href="{{ base_path }}/manage">Locations &amp; units</a>
  <span class="spacer"></span>
  <a class="nav {{ 'on' if here == base_path + '/settings' }}" href="{{ base_path }}/settings">{{ user.username }}</a>
  <a class="nav" href="#" onclick="logout(); return false">Log out</a>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
<div x-data x-cloak x-show="$store.toast.msg" class="toast" :class="$store.toast.bad && 'bad'"
     x-text="$store.toast.msg" @click="$store.toast.msg = ''"></div>
</body>
</html>
