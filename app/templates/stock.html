{% extends "base.html" %}
{% block content %}
<div x-data="stockPage()" x-init="load()" @stock-changed.window="load()">
  <div class="row">
    <h1 class="grow">Stock</h1>
    <a class="btn primary" href="/scan">Scan</a>
    <button @click="adding = true">Add stock</button>
  </div>

  <div class="card" x-show="expiring.length" x-cloak>
    <b>Going off soon</b>
    <template x-for="e in expiring" :key="e.id">
      <div class="small">
        <span x-text="e.name"></span>
        <span class="muted" x-text="'(' + qty(e.amount, e.unit) + (e.location ? ', ' + e.location : '') + ')'"></span>
        <span :class="expiry(e.expires_on, e.shelf_life_kind).cls" x-text="expiry(e.expires_on, e.shelf_life_kind).text"></span>
      </div>
    </template>
  </div>

  <div class="card" x-show="missing.length" x-cloak>
    <div class="row">
      <b class="grow">Running low</b>
      <button class="small" @click="addMissing()">Put on shopping list</button>
    </div>
    <div class="small muted" x-text="missing.map(m => m.name + ' (' + num(m.amount) + '/' + num(m.min_stock) + ' ' + m.unit + ')').join(', ')"></div>
  </div>

  <div class="row" style="margin-bottom: .6rem">
    <input class="grow" placeholder="Filter" x-model="q">
    <select x-model="loc" @change="load()" style="width: auto">
      <option value="">All locations</option>
      <template x-for="l in locations" :key="l.id"><option :value="l.id" x-text="l.name"></option></template>
    </select>
  </div>

  <div class="card">
    <p class="muted" x-show="loaded && !items.length" x-cloak>
      Nothing in stock yet. Add some <a href="/products">products</a>, then scan or add stock.
    </p>
    <template x-for="s in filtered()" :key="s.product_id">
      <div>
        <div class="list-item">
          <img x-show="s.picture" :src="pic(s.picture)" class="thumb">
          <div x-show="!s.picture" class="thumb blank"></div>
          <div class="grow" @click="toggle(s)" style="cursor: pointer">
            <div><b x-text="s.name"></b></div>
            <div class="small">
              <span x-text="qty(s.amount, s.unit, s.unit_plural)"></span>
              <span class="muted" x-text="s.locations ? ' - ' + s.locations : ''"></span>
              <span :class="expiry(s.next_expiry, s.shelf_life_kind).cls" x-text="' ' + expiry(s.next_expiry, s.shelf_life_kind).text"></span>
            </div>
          </div>
          <button class="small" @click="$dispatch('stock-modal', {product_id: s.product_id, mode: 'consume'})">Use</button>
          <button class="small hide-small" @click="$dispatch('stock-modal', {product_id: s.product_id, mode: 'purchase'})">+</button>
        </div>
        <div x-show="open == s.product_id" x-cloak style="padding: 0 0 .6rem 3rem">
          <template x-for="e in entries" :key="e.id">
            <div class="row small" style="margin: .25rem 0">
              <input type="number" step="any" min="0" x-model.number="e.amount" style="width: 6rem">
              <span x-text="s.unit"></span>
              <select x-model="e.location_id" style="width: auto">
                <template x-for="l in locations" :key="l.id">
                  <option :value="l.id" x-text="l.name" :selected="l.id == e.location_id"></option>
                </template>
              </select>
              <input type="date" x-model="e.expires_on" style="width: auto">
              <label class="inline small"><input type="checkbox" x-model="e.opened"> opened</label>
              <button class="small" @click="saveEntry(e)">Save</button>
            </div>
          </template>
          <div class="row" style="margin-top: .4rem">
            <button class="small" @click="$dispatch('stock-modal', {product_id: s.product_id, mode: 'purchase'})">Purchase</button>
            <button class="small danger" @click="$dispatch('stock-modal', {product_id: s.product_id, mode: 'consume', spoiled: true})">Spoiled</button>
            <button class="small" @click="toShopping(s)">Add to shopping list</button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <h2>Recent</h2>
  <div class="card small">
    <template x-for="g in history" :key="g.id">
      <div>
        <span class="muted" x-text="g.at.slice(5, 16)"></span>
        <span x-text="({purchase: 'bought', consume: 'used', spoiled: 'threw out', adjust: 'adjusted'})[g.kind]"></span>
        <span x-text="num(Math.abs(g.amount)) + ' ' + g.unit + ' ' + g.name"></span>
        <span class="muted" x-text="g.username ? '(' + g.username + ')' : ''"></span>
      </div>
    </template>
    <span class="muted" x-show="!history.length">Nothing yet.</span>
  </div>

  <template x-if="adding">
    <div class="modal-bg" @click.self="adding = false">
      <div class="modal">
        <b>Add stock</b>
        <label>Product</label>
        <input placeholder="Search products" x-model="pq" @input.debounce.200ms="searchProducts()" x-init="$el.focus()">
        <template x-for="p in found" :key="p.id">
          <div class="list-item" style="cursor: pointer" @click="adding = false; $dispatch('stock-modal', {product_id: p.id, mode: 'purchase'})">
            <img x-show="p.picture" :src="pic(p.picture)" class="thumb">
            <span class="grow" x-text="p.name"></span>
          </div>
        </template>
        <p class="muted small">Not there? <a href="/products?new=1">Make a new product</a>.</p>
        <button @click="adding = false">Close</button>
      </div>
    </div>
  </template>

  {% include "_stock_modal.html" %}
</div>
<script>
function stockPage() {
  return {
    items: [], expiring: [], missing: [], history: [], locations: [], entries: [],
    q: '', loc: '', open: null, loaded: false, adding: false, pq: '', found: [],
    async load() {
      try {
        const loc = this.loc ? '?location_id=' + this.loc : '';
        [this.items, this.expiring, this.missing, this.history, this.locations] = await Promise.all([
          api('/api/stock' + loc), api('/api/stock/expiring?days=3'), api('/api/stock/missing'),
          api('/api/stock/log?limit=15'), api('/api/locations')]);
        this.loaded = true;
        if (this.open) this.loadEntries(this.open);
      } catch (e) { oops(e); }
    },
    filtered() {
      const q = this.q.toLowerCase();
      return this.items.filter(s => !q || s.name.toLowerCase().includes(q));
    },
    async toggle(s) {
      if (this.open == s.product_id) { this.open = null; return; }
      this.open = s.product_id;
      await this.loadEntries(s.product_id);
    },
    async loadEntries(id) {
      const p = await api('/api/products/' + id);
      this.entries = p.stock.map(e => ({ ...e, opened: !!e.opened, expires_on: e.expires_on || '' }));
    },
    async saveEntry(e) {
      try {
        await api('/api/stock/entries/' + e.id, { method: 'PUT', body: {
          amount: e.amount, location_id: e.location_id ? Number(e.location_id) : null,
          expires_on: e.expires_on || null, opened: e.opened } });
        toast('Saved');
        this.load();
      } catch (err) { oops(err); }
    },
    async toShopping(s) {
      try {
        await api('/api/shopping', { method: 'POST', body: { product_id: s.product_id } });
        toast(s.name + ' added to the shopping list');
      } catch (e) { oops(e); }
    },
    async addMissing() {
      try {
        const r = await api('/api/shopping/add-missing', { method: 'POST' });
        toast(r.added ? 'Added ' + r.added + ' to the list' : 'Already on the list');
      } catch (e) { oops(e); }
    },
    async searchProducts() {
      this.found = this.pq ? (await api('/api/products?q=' + encodeURIComponent(this.pq))).slice(0, 15) : [];
    },
  };
}
</script>
{% endblock %}
