name: Weekly Coles price check

on:
  schedule:
    # Once a week -- Coles blocks repeat requests from one IP, so the
    # actual fetch happens on a GitHub-hosted runner (fresh IP every run)
    # rather than the home server. The home server only writes the
    # questions and reads back the answers; it never talks to Coles
    # directly, so nothing has to be exposed to the internet for this.
    - cron: "17 16 * * 2"  # Wednesday ~00:17 AWST
  workflow_dispatch: {}

jobs:
  export-queries:
    runs-on: [self-hosted, larder-home]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
      - name: List what needs asking
        env:
          LARDER_DATA: ${{ vars.LARDER_DATA_DIR }}
        run: .venv/bin/python scripts/coles_export_queries.py coles-queries.json
      - uses: actions/upload-artifact@v4
        with:
          name: coles-queries
          path: coles-queries.json
          retention-days: 1

  fetch-from-coles:
    needs: export-queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coles-queries
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
      - name: Ask Coles (fresh IP, never the home server's)
        run: .venv/bin/python scripts/coles_fetch_queries.py coles-queries.json coles-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: coles-results
          path: coles-results.json
          retention-days: 1

  apply-results:
    needs: fetch-from-coles
    runs-on: [self-hosted, larder-home]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coles-results
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
      - name: Write the answers into the real data
        env:
          LARDER_DATA: ${{ vars.LARDER_DATA_DIR }}
        run: .venv/bin/python scripts/coles_apply_results.py coles-results.json
